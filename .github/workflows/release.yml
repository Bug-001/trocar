# Release automation (RFC 4.5:52,54 / D23). Tag `v*` → test on both onboard OSes → GitHub Release
# carrying the `npm pack` tarball. Publishing to the npm registry is a SEPARATE job that stays
# switched off until the project is ready to be installed from npm.
#
# TODAY: tagging runs the tests on ubuntu + macOS and creates a GitHub Release
# with the tarball attached. Nothing is published to npm.
#
# TO TURN NPM PUBLISHING ON LATER (deliberate gates — publishing is outward-facing and irreversible):
#   1. Repository variable PUBLISH_NPM = true  (Settings → Secrets and variables → Actions → Variables).
#   2. Add a LICENSE, remove `"private": true` from package.json, and check that `trocar` is still
#      free on npm (it was on 2026-10-20, RFC 4.5).
#   3. Add an `NPM_TOKEN` repository secret (an npm automation token with publish rights).
#   4. `--provenance` (id-token attestation) needs the repository public; it is, since 2026-10-20.
name: release

on:
  push:
    tags: ['v*']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: pack tarball for the Release
        run: npm pack --pack-destination dist
      - name: GitHub Release + tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.tgz --title "${{ github.ref_name }}" --generate-notes

  publish-npm:
    # OFF by default: runs only when the PUBLISH_NPM repository variable is exactly 'true'.
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      # platform-independent npm package (duckdb ships its own prebuilts; none enter our tarball)
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
