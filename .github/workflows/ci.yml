# CI gate (RFC 4.5:54). Proves the offline green line — capture→storage→transport→render —
# runs on BOTH real OSes onboard targets: macOS + Linux. The @duckdb/node-api native addon
# resolves its prebuilt per-runner via `npm ci`; nothing platform-specific enters our package.
name: ci

# push runs only on main; a PR branch is tested once, by pull_request. Triggering both on every
# PR commit ran each job twice.
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # `| tee` keeps the TAP summary for the count below; `pipefail` keeps a red test red (GitHub's default bash has no pipefail).
      - run: |
          set -o pipefail
          npm test -- --test-reporter=tap | tee test.log
      - name: record how many tests ran
        if: ${{ !cancelled() }}
        run: |
          mkdir counts
          node scripts/count-tests.mjs read test.log ${{ matrix.os }} ${{ matrix.node }} > counts/${{ matrix.os }}-node${{ matrix.node }}.json
          cat counts/*.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-count-${{ matrix.os }}-node${{ matrix.node }}
          path: counts/

  # A run that drops test results does not fail (Node 20's --test-force-exit reported 1903 to 1924 of 1936 tests, all "0 fail";
  # test/helpers/flush-exit.cjs is the fix). The suite runs the same tests on Node 20 and 22 on the same OS, so a count that
  # differs between them is a run that lost some. Runs even when a test job is red, so the counts are still on the page.
  counts-agree:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: test-count-*
          path: counts
          merge-multiple: true
      - run: node scripts/count-tests.mjs compare counts
