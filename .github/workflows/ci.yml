# CI gate (RFC 4.5:54). Proves the offline green line — capture→storage→transport→render —
# runs on BOTH real OSes onboard targets: macOS + Linux. The @duckdb/node-api native addon
# resolves its prebuilt per-runner via `npm ci`; nothing platform-specific enters our package.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
