  // per-call cache reading, aligned 1:1 under the bars (truthful: read/total from real usage)
  document.getElementById('cacherow').innerHTML=win.map(([s,i])=>{
    const u=s.usage||{}, read=u.read||0, tot=(s.ctx||0)||1, r=read/tot
    const cls=s.error?'lo':r>=0.7?'hi':r>=0.3?'mid':'lo'
    return `<div class="cbar ${cls} ${i===playhead?'cur':''}" title="#${i+1} · cache read ${kf(read)}/${kf(tot)} · ${Math.round(r*100)}%"></div>`
  }).join('')
  const full=(lo===0&&hi===N)
  // BUG 1 (audit 2026-07-19): the label was hardcoded `💬 conversation` while the anchor may be
  // ANY lane (`lanes.find(main)||lanes[0]` — real Desktop captures often have no main lane), so a
  // security-monitor / subagent lane was presented AS the conversation. Name the lane we are
  // actually drawing (server ships lane.icon/lane.label — invariant 3: no provider logic here).
  const isMain=anchor.kind==='main'
  const laneName=isMain?'conversation':(anchor.label||anchor.kind||'lane'), laneIcon=isMain?'💬':(anchor.icon||'▤')
  document.getElementById('sawmid').textContent=`${laneName} ctx ↑`
  const ss=document.getElementById('sawstart'); if(ss) ss.textContent=full?'call #1':('call #'+(lo+1))
  document.getElementById('sawend').textContent=full?('call #'+N):(`#${lo+1}–#${hi} of ${N}`)
  document.getElementById('phlabel').textContent=` ${playhead+1}/${N} `
  document.getElementById('lanehint').innerHTML=`${esc(laneIcon)} <b style="color:var(--fg)">${esc(laneName)}</b>`+
    (isMain?'':` <span class="estbadge" title="this capture has no main conversation lane; the board is anchored on this off-main lane instead — its calls are NOT conversation turns (不变式4)">no main lane · off-main anchor</span>`)+
    ` — ${N} ${isMain?'turns':'calls'}, peak ${kf(anchor.peakCtx)} tok${full?'':` · <span style="color:var(--dim)">viewing ${hi-lo}</span>`}`
}
// ── D13 overview strip + brush (focus+context navigator) ─────────────────────
const OVW_BARCAP=60
function renderOverview(){
  const strip=document.getElementById('ovstrip'); if(!strip) return
  const N=anchor?anchor.calls.length:0
  if(!N){ strip.innerHTML=''; return }
  // don't destroy the brush element (+ its pointer capture / drag closure) mid-drag: a live poll's
  // render() would otherwise silently kill an in-flight drag. Just reposition; rebuild after the drag.
  if(brushDragging){ repositionBrush(); return }
  const peak=Math.max(1,anchor.peakCtx)
  let bg='', sampled=false
  if(N<=OVW_BARCAP){
    // few steps: one discrete mini-bar per call (faithful, per-step)
    bg='<div class="ovbars">'+anchor.calls.map((s,i)=>{
      const h=Math.max(1,Math.round((s.ctx||0)/peak*20))
      return `<div class="ovbar ${s.error?'err':''}" style="height:${h}px" title="#${i+1}"></div>`
    }).join('')+'</div>'
  } else {
    // many steps: streamline. buckets B=min(N,240); each point on the SAME /N axis as the brush/pin
    // (bucket-center step / N), so the streamline and the brush can't fencepost-drift. Only mark
    // 采样显示 when buckets actually MERGE steps (N>240) — for 60<N≤240 it's per-step, no false label.
    const B=Math.min(N,240); sampled=(N>B)
    const pts=[]
    for(let k=0;k<B;k++){
      const a=Math.floor(k*N/B), b=Math.max(a+1,Math.floor((k+1)*N/B))
      let mx=0; for(let j=a;j<b&&j<N;j++){ const cv=anchor.calls[j].ctx||0; if(cv>mx)mx=cv }
      pts.push((((a+b)/2)/N*100).toFixed(2)+','+(22-Math.max(0.5,mx/peak*20)).toFixed(2))
    }
    bg=`<svg class="ovsvg" viewBox="0 0 100 22" preserveAspectRatio="none"><polyline points="${pts.join(' ')}"/></svg>`
  }
  strip.innerHTML=bg
    +(sampled?'<span class="ovsample" title="downsampled — one point per bucket, not per step (fidelity: overview is a map, not verbatim)">采样显示 · sampled</span>':'')
    +'<div class="ovpin" id="ovpin"></div>'
    +'<div class="ovbrush" id="ovbrush" title="drag = pan · drag an edge = zoom · dbl-click = full"><span class="ovh ovh-l"></span><span class="ovh ovh-r"></span></div>'
  repositionBrush()
  wireBrush()
}
function repositionBrush(){
  const N=anchor?anchor.calls.length:1
  const b=document.getElementById('ovbrush')
  if(b&&b.style){ b.style.left=(view.lo/N*100).toFixed(3)+'%'; b.style.width=((view.hi-view.lo)/N*100).toFixed(3)+'%' }
  const p=document.getElementById('ovpin')
  if(p&&p.style) p.style.left=((playhead+0.5)/N*100).toFixed(3)+'%'
}
// single entry point for changing the window. redraw=true rebuilds the overview backdrop
// (session load / reset); during a drag we pass false so the captured brush element survives.
function setView(lo,hi,redraw){
  const N=anchor?anchor.calls.length:0; if(!N) return
  lo=Math.max(0,Math.min(N-1,Math.round(lo)))
  hi=Math.max(lo+1,Math.min(N,Math.round(hi)))
  if(lo===view.lo&&hi===view.hi&&redraw!==true){ return }
  view.lo=lo; view.hi=hi
  renderSaw(); renderRails()
  if(redraw) renderOverview(); else repositionBrush()
}
function wireBrush(){
  const strip=document.getElementById('ovstrip'), brush=document.getElementById('ovbrush')
  if(!strip||!brush||!brush.addEventListener) return
  const N=()=>anchor?anchor.calls.length:1
  const stripW=()=>{ try{ const r=strip.getBoundingClientRect(); return Math.max(1,r.width) }catch{ return 1 } }
  let mode=null, startX=0, startLo=0, startHi=0
  const down=(e,m)=>{ mode=m; brushDragging=true; startX=e.clientX; startLo=view.lo; startHi=view.hi
    try{ const t=e.currentTarget||brush; t.setPointerCapture&&t.setPointerCapture(e.pointerId) }catch{}
    if(e&&e.stopPropagation)e.stopPropagation(); if(e&&e.preventDefault)e.preventDefault() }
  const move=e=>{ if(!mode) return
    const n=N(), d=Math.round((e.clientX-startX)/stripW()*n)
    if(mode==='pan'){ const dd=Math.max(-startLo,Math.min(n-startHi,d)); setView(startLo+dd,startHi+dd,false) }
    else if(mode==='l'){ setView(Math.min(startHi-1,startLo+d),startHi,false) }
    else if(mode==='r'){ setView(startLo,Math.max(startLo+1,startHi+d),false) } }
  const up=()=>{ if(!mode)return; mode=null; brushDragging=false; renderOverview() } // rebuild backdrop (may be stale from a poll during the drag)
  brush.addEventListener('pointerdown',e=>{ if(e&&e.target&&e.target.classList&&e.target.classList.contains('ovh')) return; down(e,'pan') })
  brush.addEventListener('pointermove',move); brush.addEventListener('pointerup',up); brush.addEventListener('pointercancel',up)
  brush.addEventListener('dblclick',e=>{ if(e&&e.preventDefault)e.preventDefault(); setView(0,N(),true) })
  const hl=brush.querySelector('.ovh-l'), hr=brush.querySelector('.ovh-r')
  ;[[hl,'l'],[hr,'r']].forEach(([h,m])=>{ if(h&&h.addEventListener){
    h.addEventListener('pointerdown',e=>down(e,m)); h.addEventListener('pointermove',move)
    h.addEventListener('pointerup',up); h.addEventListener('pointercancel',up) } })
}

// ── lane rails ──────────────────────────────────────────────────────────────
const RKIND = {
  monitor:'verbatim context · hover a tick to see what it reviewed',
  probe:'measures the full context · hover to see the span',
  aux:'no real context · click a tick for the input',
  notify:'summarizes your activity → drives Desktop notifications · click for the output',
  titlegen:'names the session (2-4 words) · click to see the label it produced',
  quota:'max_tokens:1 keep-alive ping · output discarded · click for detail',
  subagent:'own context stream · click a tick for detail',
}
function railHtml(l){
  const col=collapsedRails.has(l.id)
  const errs=l.calls.filter(c=>c.error).length
  // point 3: title in the fixed left gutter (one row per track), lane aligned to the bars;
  // the descriptive RKIND hint moves to the title tooltip to save width.
  const title=`<div class="tgut railname ${col?'col':''}" data-toggle="${esc(l.id)}" title="${esc(RKIND[l.kind]||'')}">`+
    `<span>${col?'▸':'▾'}</span> ${l.icon} <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.label)}</span> <span class="rc">${l.calls.length}</span>`+
    `${l.kind==='monitor'&&l.flagged?` <span class="rflag">${l.flagged}⚑</span>`:''}${errs?` <span class="rflag" title="${errs} interrupted">⚠${errs}</span>`:''}</div>`
  return `<div class="rail k-${l.kind} trow">${title}${col?'<div class="tlane"></div>':`<div class="tlane railbody" data-lane="${esc(l.id)}">${renderTicks(l)}</div>`}</div>`
}
function renderRails(){
  const rl=lanes.filter(l=>l!==anchor)
  // many short subagent lanes (e.g. a review/eval workflow's fan-out) would otherwise flood the
  // rail area and bury the conversation — group them under ONE collapsed rail (default closed).
  const subs=rl.filter(l=>l.kind==='subagent'), others=rl.filter(l=>l.kind!=='subagent')
  subs.forEach(l=>{ if(!subSeeded.has(l.id)){ subSeeded.add(l.id); collapsedRails.add(l.id) } }) // each subagent starts collapsed
  let html=''
  if(subs.length>1){
    const totalCalls=subs.reduce((n,l)=>n+l.calls.length,0)
    html+=`<div class="rail k-subagent subgroup">`+
      `<div class="railhead subgrouphd" data-subtoggle="1">${subgroupOpen?'▾':'▸'} 🧬 <b>subagents</b> <span class="rc">${subs.length} lanes · ${totalCalls} calls</span><span class="rkind">spawned Task/Agent streams (incl. review/eval fan-out) · expand to see each</span></div>`+
      (subgroupOpen?`<div class="subkids">${subs.map(railHtml).join('')}</div>`:'')+
      `</div>`
  } else if(subs.length===1){ html+=railHtml(subs[0]) }
  html+=others.map(railHtml).join('')
  document.getElementById('rails').innerHTML = html || '<div style="color:var(--dimmer);font-size:10px;padding:6px 0">no other lanes in this session</div>'
  // wire the subagent-group toggle
  const sg=document.querySelector('#rails [data-subtoggle]'); if(sg) sg.onclick=()=>{ subgroupOpen=!subgroupOpen; renderRails() }
  // wire per-lane toggles + ticks (only real lane heads, NOT the group head)
  document.querySelectorAll('#rails [data-toggle]').forEach(h=>h.onclick=()=>{ const id=h.dataset.toggle; if(collapsedRails.has(id))collapsedRails.delete(id); else collapsedRails.add(id); renderRails() })
  document.querySelectorAll('#rails .tick, #rails .pbar').forEach(t=>{
    const lane=lanes.find(l=>l.id===t.dataset.lane), i=+t.dataset.i
    t.onmouseenter=()=>{ if(lane.kind==='monitor'||lane.kind==='probe') highlightRange(lane,i) }
    t.onmouseleave=()=>{ if(!selTick) clearRange() }
    t.onclick=(e)=>{ e.stopPropagation(); selectTick(lane,i) }
  })
  // whole-rail interaction: click/hover ANYWHERE picks the nearest call (so every probe is reachable,
  // not just the ~300 rendered ticks)
  document.querySelectorAll('#rails .railbody').forEach(body=>{
    const lane=lanes.find(l=>l.id===body.dataset.lane); if(!lane||!lane.calls.length)return
    // pick the nearest call — but only among those IN the current window (matching what's rendered;
    // out-of-window calls all sit clamped at an edge and would hijack edge clicks). Full window ⇒
    // every call is in-window ⇒ full reachability (2.1 AC-全量可达) preserved. Fallback if none in-window.
    const nearestX=e=>{ const r=body.getBoundingClientRect(); const f=(e.clientX-r.left)/Math.max(1,r.width)
      let b=-1,bd=Infinity; lane.calls.forEach((c,i)=>{ if(!inWindow(c.ts))return; const d=Math.abs(xOf(c.ts)-f); if(d<bd){bd=d;b=i} })
      if(b<0) lane.calls.forEach((c,i)=>{const d=Math.abs(xOf(c.ts)-f); if(d<bd){bd=d;b=i}}); return b }
    body.style.cursor='pointer'
    body.onmousemove=e=>{ if(lane.kind==='monitor'||lane.kind==='probe') highlightRange(lane,nearestX(e)) }
    body.onmouseleave=()=>{ if(!selTick) clearRange() }
    body.onclick=e=>selectTick(lane,nearestX(e))
  })
  if(selTick){ const el=document.querySelector(`#rails [data-lane="${cssq(selTick.laneId)}"][data-i="${selTick.i}"]`); if(el) el.classList.add('sel') }
}
function cssq(s){ return String(s).replace(/"/g,'\\"') }
// D13: the saw is windowed to [view.lo,view.hi) — the rails MUST be too. Ticks whose step
// position is outside the window are CULLED (not clamp-piled at the edges, which would desync
// the rails from the bars = a visual lie). data-i stays the GLOBAL index so selectTick is correct.
function inWindow(ts){ const lo=view.lo|0, hi=Math.max(lo+1, view.hi||anchorTs.length), p=stepPos(ts); return p>=lo && p<hi }
function renderTicks(lane){
  const win=lane.calls.map((c,i)=>({c,i})).filter(o=>inWindow(o.c.ts))
  if(lane.kind==='probe'){
    const MAX=300, step=Math.max(1,Math.ceil(win.length/MAX))
    const peak=Math.max(1,lane.peakCtx)
    return win.filter((_,j)=>j%step===0).map(({c,i})=>{
      const h=Math.max(1,Math.round(c.ctx/peak*24))
      return `<span class="pbar" data-lane="probe" data-i="${i}" style="left:${(xOf(c.ts)*100).toFixed(2)}%;height:${h}px" title="${kf(c.ctx)} tok @ ${fmtTime(c.ts)}"></span>`
    }).join('')
  }
  return win.map(({c,i})=>
    `<span class="tick ${c.flagged?'flag':''} ${c.error?'errtick':''}" data-lane="${esc(lane.id)}" data-i="${i}" style="left:${(xOf(c.ts)*100).toFixed(2)}%" title="${lane.icon} @ ${fmtTime(c.ts)} · ${c.error?'⚠ interrupted':'ctx '+kf(c.ctx)}"></span>`
  ).join('')
}
function highlightRange(lane,i){
  const c=lane.calls[i]; if(!c) return
  const k=turnsReviewed(c.ts)
  // bars carry a GLOBAL data-i, so gate on that (correct whether or not the view is windowed)
  const bars=[...document.querySelectorAll('#sawrow .bar')]
  bars.forEach(b=>b.classList.toggle('reviewed', (+b.dataset.i)<k))
  const br=document.getElementById('reviewbracket')
  // bracket spans the reviewed fraction of the CURRENT window, clamped to it
  if(br){ br.style.display='block'; const frac=Math.max(0,Math.min(1,(k-view.lo)/Math.max(1,view.hi-view.lo))); br.style.width=(frac*100).toFixed(2)+'%' }
}
function clearRange(){ document.querySelectorAll('#sawrow .bar.reviewed').forEach(b=>b.classList.remove('reviewed')); const br=document.getElementById('reviewbracket'); if(br)br.style.display='none' }

// ── lane-call detail panel ──────────────────────────────────────────────────
function callInput(c){
  const rq=c.rec?.request||{}
  // BUILT FROM THE ASSEMBLED BLOCKS, NOT FROM THE RAW REQUEST BODY.
  //
  // This used to read rq.system / rq.messages, which slimRec()'s five-field whitelist dropped — so
  // the persona line and the user excerpt went permanently blank with no explanation. The same
  // content is already here, normalized and cross-provider, in c.flat: the server's `preview` for
  // every block, plus `query` marking the human turns. Reading it from there also honours invariant 3
  // — rq.system[]/rq.messages[].content[].type is Anthropic wire shape, and an OpenAI-Responses body
  // has none of those keys, so this panel was Anthropic-only besides being empty.
  const flat=c.flat||[]
  const sys=flat.filter(b=>b.sec==='system').map(b=>b.preview!==undefined?b.preview:(b.text||'')).join('\n')
  const persona=(sys.match(/You are [^\n]+/)||[''])[0]
  const user=flat.filter(b=>b.sec==='messages'&&b.query).map(b=>b.query).join('\n')
  // A paged-out call ships no blocks at all, so say that rather than render three blank lines.
  if(!flat.length&&(c.paged_out||rq.context_chars!==undefined)){
    return {persona:'',sysFull:'',user:'',notShipped:'context not shipped on this page — scroll this call into the window to load it'}
  }
  return {persona,sysFull:sys,user}
}
const callRef = k => `<a class="callref" data-call="${k}">call #${k}</a>`
function selectTick(lane,i){
  if(i==null||i<0||!lane.calls[i]) return // guard nearestX's empty-window fallback (never openDetail(-1))
  selTick={laneId:lane.id,i}
  document.querySelectorAll('#rails .tick.sel, #rails .pbar.sel').forEach(e=>e.classList.remove('sel'))
  const el=document.querySelector(`#rails [data-lane="${cssq(lane.id)}"][data-i="${i}"]`); if(el)el.classList.add('sel')
  if(lane.kind==='monitor'||lane.kind==='probe') highlightRange(lane,i); else clearRange()
  // jump the conversation to the same moment in time
  const c=lane.calls[i]; if(c&&anchor.calls.length){ playhead=nearestByTs(anchor,c.ts); follow=false; renderSaw(); renderContextWindow(); renderContextNav() }
  openDetail(lane,i)
}
function openDetail(lane,i){
  const c=lane.calls[i], det=document.getElementById('detail')
  let title, body
  if(lane.kind==='probe'){
    const k=Math.max(1,turnsReviewed(c.ts))
    const turn=anchor.calls[Math.min(anchor.calls.length-1,k-1)], rq=turn?.rec?.request||{}
    title=`👁 ${esc(lane.label||'probe')} · ${fmtTime(c.ts)}`
    // a server lane says what it is (lane.note); the count_tokens rail is a ruler whose body is not kept
    body=(lane.note?`<div class="din">${esc(lane.note)}</div>`
      :`<div class="din">A token-count probe: the agent sends a copy of the context to be measured and gets back only its size. A ruler, not a turn — no model output, not billed. asight keeps only the size: the probe's request body is <b>not retained</b> (it is almost a copy of the next request; 3.2 / D34).</div>`)+
      `<div class="din">measured <b>${kf(c.ctx)}</b> tokens</div>`+
      `<div class="din">payload ≈ the context around ${callRef(k)}: <b>${kf(rq.message_count)}</b> messages · system <b>${kf(rq.system_chars)}</b> chars · <b>${kf(rq.tool_count)}</b> tools · ${kf(rq.context_chars)} bytes on the wire.</div>`
  } else if(lane.kind==='monitor'){
    const {sysFull,user}=callInput(c), nr=c.norm||{}, k=Math.max(1,turnsReviewed(c.ts))
    const v=(nr.text||'').replace(/<\/?block>/g,'').trim()
    const ti=user.indexOf('<transcript>'), te=user.lastIndexOf('</transcript>')
    // show the EXACT input message (原文); fold only the verbatim <transcript> body IN PLACE,
    // so the reader sees the real structure of what was sent, not a description of it
    let msgHtml
    if(ti>=0&&te>ti){
      const pre=user.slice(0,ti), trans=user.slice(ti,te+'</transcript>'.length), post=user.slice(te+'</transcript>'.length)
      msgHtml=esc(pre)+collapse('<pre>'+esc(trans)+'</pre>',trans.length,'montr:'+lane.id+':'+i,`⟨verbatim conversation transcript · ${kf(c.ctx)} tok · call #1→#${k} · click to unfold⟩`)+esc(post)
    } else msgHtml=esc(user)
    title=`🛡 security check #${i+1} · ${fmtTime(c.ts)} · ${kf(c.ctx)} tok`
    body=`<div class="din">verdict: <b style="color:${c.flagged?'var(--red)':'var(--green)'}">${esc(v||'clear')}</b> · reviewed your conversation ${callRef(1)} → ${callRef(k)}</div>`+
      costDin(c)+
      `<div class="din" style="color:var(--dim)">the monitor's exact input message (原文) — only the repeated <code>&lt;transcript&gt;</code> is folded:</div>`+
      `<div class="din monmsg">${msgHtml}</div>`+
      `<div class="din" style="color:var(--dim)">▸ monitor system rules (${kf(sysFull.length)} chars, identical every check):</div>`+
      collapse('<pre>'+esc(sysFull)+'</pre>',sysFull.length,'det:'+lane.id+':'+i)
  } else {
    // aux family — differentiated per subkind (activity→notify / title-gen / quota), each with its raw input
    const {persona,user}=callInput(c), nr=c.norm||{}
    const out=nr.text||'', model=String(c.rec?.request?.model||'').replace('claude-','')
    title=`${lane.icon} ${esc(lane.label)} #${i+1} · ${fmtTime(c.ts)}`
    let lead
    if(lane.kind==='notify'){
      let st; try{ const j=JSON.parse(out.replace(/```json|```/g,'').trim()); st=`state=<b>${esc(j.state||'?')}</b> · tempo=${esc(j.tempo||'?')}${j.needs?` · <b style="color:var(--amber)">needs: ${esc(j.needs)}</b>`:''}<br>${esc(j.detail||j.output?.result||'')}` }catch{ st=esc(clip(out,300)) }
      lead=`<div class="din">📣 <b>Background activity summary</b> → drives Claude Desktop's push notifications (agent done / needs you). The client consumes this; it never enters your conversation.</div>`+
        `<div class="din" style="border-left:2px solid var(--green);padding-left:8px">${st}</div>`
    } else if(lane.kind==='titlegen'){
      lead=`<div class="din">🏷 <b>Session title generator</b> — this is where the session's short name comes from.</div>`+
        `<div class="din">generated label: <b style="color:var(--cyan)">${esc(out||'(none)')}</b></div>`
    } else if(lane.kind==='quota'){
      lead=`<div class="din">🔌 <b>Quota / keep-alive ping</b> · <code>max_tokens:1</code>. Confirms the account can call and warms the connection; the reply <code>${esc(out||'#')}</code> is <b>discarded</b>.</div>`
    } else {
      lead=`<div class="din">${esc(model)} · output: <b>${esc(out||'(none)')}</b></div>`
    }
    body=lead+(lane.kind!=='quota'?costDin(c):'')+`<div class="din persona">${esc(persona)}</div>`+
      `<div class="din" style="color:var(--dim)">input (原文):</div>`+collapse('<pre>'+esc(user)+'</pre>',user.length,'det:'+lane.id+':'+i)
  }
  det.className='open k-'+lane.kind
  det.innerHTML=`<div class="dclose" id="dclose">✕ close</div><h3>${title}</h3>${body}`
}
function closeDetail(){ selTick=null; clearRange(); const d=document.getElementById('detail'); d.className=''; document.querySelectorAll('#rails .sel').forEach(e=>e.classList.remove('sel')) }

// ── the ONE faithful context window: exactly tools → system → messages, in assembly order ──
// The middle window IS the ground truth of what the model received this call — no "not in list",
// no separate raw column. Compaction naturally swaps the whole window (its content changed).
function ctxArg(b){ // short arg preview for a tool_use block header
  const inp=(b&&b.input)||{}
  if(inp.file_path||inp.path||inp.notebook_path) return relPath(String(inp.file_path||inp.path||inp.notebook_path))
  if(inp.command) return String(inp.command)
  if(inp.pattern) return String(inp.pattern)
  if(inp.url||inp.query) return String(inp.url||inp.query)
  if(inp.description||inp.subagent_type) return String(inp.description||inp.subagent_type)
  if(inp.skill) return 'skill: '+String(inp.skill||inp.command||'')
  return ''
}
const preview=s=>String(s||'').replace(/\s+/g,' ').trim().slice(0,90)
function blockHead(b){
  if(b.sec==='tools') return {role:'tool',tag:'def'+(b.mcp?' · MCP':''),label:esc(b.name)}
  if(b.sec==='system') return {role:'system',tag:b.label,label:''}
  const r=b.role, k=b.kind

    // instructions are actually RESIDENT + viewable (verbatim SKILL.md body on the wire) → a
    // richer card: enter step + segment residency + resident size + 👁 that reveals the verbatim
    // body (never a fabricated schema). MCP/other caps stay metadata chips (schema not verbatim, §58).
    const skKids=skills.map(r=>{
      const enter=L(r.segments[0].enter), lastSeg=r.segments[r.segments.length-1]
      const live=r.segments.some(s=>{const e=L(s.enter),ev=s.evict==null?N:L(s.evict);return e<=playhead&&ev>playhead})
      const notYet=enter>playhead, evAt=lastSeg.evict==null?null:L(lastSeg.evict)
      const state=notYet?'pend':(!live&&!notYet?'dead':'')
      const life=live?'<span class="en">resident</span>':(evAt!=null?`<span class="ev">✂#${evAt+1}</span>`:'')
      const size=r.loads.length?r.loads[r.loads.length-1].range:''
      const vd=`data-view="skill::${esc(r.label)}" data-viewstep="${enter}" data-viewlabel="${esc(r.label)}"`
      // size present ⇒ the verbatim body was captured; absent ⇒ only the Skill invocation was seen (labelled honestly)
      return `<div class="navsub ${state}" data-navstep="${enter}" data-navres="skill::${esc(r.label)}"><span class="nsl viewname" ${vd} title="skill (asight inference from the wire) — 👁 shows the verbatim SKILL.md body">🧩 skill: ${esc(r.label)}</span>`+
        (size?`<span class="viewbtn" ${vd} title="show the verbatim SKILL.md body in the panel">👁</span>`:'')+
        `${life}${size?`<span class="nsx" title="resident instructions size — verbatim body on the wire">${esc(size)}</span>`:`<span class="nsx" title="invocation seen; resident body not in the captured window">invocation only</span>`}<span class="nsx">#${enter+1}</span></div>`
    }).join('')
    // unify the caps' name click with files: name/👁 → viewResource (raw preview), card body → locate.
    // MCP resolves to its tool block (metadata, honestly noted in the panel); image/document have no
    // verbatim text block → viewResource falls back to the honest "click the card to locate" message.
    const capKids=caps.map(r=>{ const enter=L(r.segments[0].enter)
      // map the ledger label back to the block's resKey so the reveal can find it (MCP: → mcp::)
      const mm=/^MCP:\s*(.+)$/.exec(r.label), rk=mm?'mcp::'+mm[1]:''
      const vd=`data-view="${esc(rk)}" data-viewstep="${enter}" data-viewlabel="${esc(r.label)}"`
      return `<div class="navsub" data-navstep="${enter}"${rk?` data-navres="${esc(rk)}"`:''}><span class="nsl viewname" ${vd} title="capability — 👁 shows what's on the wire (MCP: tool metadata; image/document: located on the timeline)">🧩 ${esc(r.label)}</span><span class="viewbtn" ${vd} title="show in the panel">👁</span><span class="nsx">#${enter+1}</span></div>` }).join('')
    h+=navGroup('life-cap','🧩','capabilities',skills.length+caps.length,skKids+capKids)
  }
  if(dl.length){
    const kids=dl.map(r=>{ const enter=L(r.segments[0].enter), ic=r.kind==='dir'?'📁':'🔗'; return `<div class="navsub" data-navstep="${enter}"><span class="nsl">${ic} ${esc(relPath(r.label))}</span><span class="nsx">#${enter+1}</span></div>` }).join('')
    h+=navGroup('life-dl','🔗','dirs & links',dl.length,kids)
  }
  const comps=(anchor.events||[]).filter(e=>e.type==='compaction'||e.type==='summarize')
  if(comps.length){
    const kids=comps.map(e=>{ const at=L(e.step), lbl=e.type==='compaction'?`✂ compaction ${e.from}→${e.to} msgs`:`🗜 summary (${kf(e.out)} tok out)`; return `<div class="navsub" data-navstep="${at}"><span class="nsl">${lbl}</span><span class="nsx">#${at+1}</span></div>` }).join('')
    h+=navGroup('life-comp','✂','context resets',comps.length,kids)
  }
  return h||'<div class="navsub" style="opacity:.5">no resources tracked yet</div>'
}

// render a message content-block's body text (reused by the context window's lazy bodies)
function rawContentText(b){
  if(typeof b==='string') return b
  if(b.type==='text') return b.text||''
  if(b.type==='tool_use'||b.type==='server_tool_use') return `${b.name}(\n${JSON.stringify(b.input,null,2)}\n)`
  if(b.type==='tool_result'){ const c=b.content; return (typeof c==='string'?c:Array.isArray(c)?c.map(x=>x.text||`[${x.type}]`).join('\n'):JSON.stringify(c))+(b.is_error?'  ⟨is_error⟩':'') }
  if(b.type==='image') return `[image ${b.source?.media_type||b.source?.type||''}]`
  if(b.type==='document') return `[document ${b.source?.media_type||b.source?.type||b.title||''}]`
  if(b.type==='thinking') return b.thinking||''
  if(b.type==='redacted_thinking') return '[redacted_thinking]'
  return JSON.stringify(b,null,2)
}

// ── navigation ──────────────────────────────────────────────────────────────
function nearestByTs(lane,ts){
  if(!lane.calls.length)return 0
  const t=Date.parse(ts); if(isNaN(t))return Math.min(playhead,lane.calls.length-1)
  let best=0,bd=Infinity
  lane.calls.forEach((c,i)=>{ const d=Math.abs(Date.parse(c.ts)-t); if(d<bd){bd=d;best=i} })
  return best
}
// BUG 1: the playhead landed on a call whose body did NOT ride on the loaded page. Re-aim the cursor
// window around it (centred, so scrubbing a few steps either way stays inside it) and re-poll. The
// call keeps rendering meanwhile — its cheap meta is real — marked "not loaded on this page", never
// blank (不变式4). Returns whether a fetch was kicked off.
function ensurePage(call,force){
  if(!call||!call.paged_out) return false
  const c=Math.max(0,(call.gi|0)-((PAGE_LIMIT/2)|0))
  if(c===(pageCur|0)&&!force) return false // already asking for this window; a re-poll would loop
  pageCur=c
  follow=false      // we are deliberately looking away from the live end; don't let poll() re-park on the tail
  pageReaimed=false // a user-driven move gets a fresh self-correct budget
  lastCheapSig=null; lastRenderSig=null
  poll()
  return true
}
function setPlayhead(i,manual){
  if(!anchor)return
  if(!anchor.calls||!anchor.calls.length)return // R10: zero-call session — "⇥ latest" is a no-op, not a TypeError
  viewPin=null // scrubbing returns the panel to the call raw
  const np=Math.max(0,Math.min(anchor.calls.length-1,i))
  if(np!==playhead) openBlocks.clear() // a different call → its blocks start collapsed
  playhead=np
  if(manual) follow=(playhead===anchor.calls.length-1)
  // D13: keep the scrub target inside the brush window (pan, preserve width) — 1.4 follow
  if(playhead<view.lo||playhead>=view.hi){
    const w=Math.max(1,view.hi-view.lo), N=anchor.calls.length
    const lo=Math.min(Math.max(0,playhead-((w/2)|0)),Math.max(0,N-w))
    view.lo=lo; view.hi=Math.min(N,lo+w)
  }
  renderSaw(); renderRails(); renderContextWindow(); renderContextNav(); repositionBrush()
  ensurePage(anchor.calls[playhead]) // BUG 1: scrubbed outside the loaded window → go get that window
  if(selTick){ const l=lanes.find(x=>x.id===selTick.laneId); if(l&&(l.kind==='monitor'||l.kind==='probe'))highlightRange(l,selTick.i) }
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeDetail(); return }
  if(!anchor)return
  if(e.key==='ArrowLeft'){setPlayhead(playhead-1,true);e.preventDefault()}
  else if(e.key==='ArrowRight'){setPlayhead(playhead+1,true);e.preventDefault()}
  else if(e.key==='Home'){setPlayhead(0,true);e.preventDefault()}
  else if(e.key==='End'){setPlayhead(anchor.calls.length-1,true);e.preventDefault()}
})

// ── draggable board boundary: #ctxwin (center) ↔ #rightpage (right) ──────────────
// Spec 1.2 §39-40/§77/§83: the #divider affordance is rendered but drag was never wired.
// Drive #rightpage width from a root custom prop (never inline — inline would beat the
// @media narrow-stack rule), with min/max clamp + per-boundary localStorage persistence
// (dbl-click = reset). Defensive by construction so the headless render gate (DOM shim
// with no-op addEventListener, no documentElement, no localStorage) imports without throwing.
;(function(){
  try{
    const KEY='atrace.split.rightpage', DEF=320, MIN=220
    const divider=document.getElementById('divider'), pages=document.getElementById('pages'), rightpage=document.getElementById('rightpage')
    const root=document.documentElement
    let curW=DEF
    const setW=w=>{ curW=w; if(root&&root.style&&root.style.setProperty) root.style.setProperty('--rightpage-w',w+'px') }
    const lsGet=k=>{ try{ return (typeof localStorage!=='undefined')?localStorage.getItem(k):null }catch{ return null } }
    const lsSet=(k,v)=>{ try{ if(typeof localStorage!=='undefined') localStorage.setItem(k,v) }catch{} }
    const lsDel=k=>{ try{ if(typeof localStorage!=='undefined') localStorage.removeItem(k) }catch{} }
    const clampW=w=>{
      let max=720
      try{ const pr=pages&&pages.getBoundingClientRect&&pages.getBoundingClientRect(); if(pr&&pr.width) max=Math.min(720,pr.width-380) }catch{}
      if(!(max>MIN)) max=MIN
      return Math.max(MIN,Math.min(max, (isFinite(w)?w:DEF)))
    }
    // restore persisted width (runs at import — must not throw under the shim)
    const saved=parseFloat(lsGet(KEY))
    if(saved>0) setW(clampW(saved))
    if(!divider||!pages||!rightpage) return
    let dragging=false
    divider.addEventListener('pointerdown',e=>{
      dragging=true
      try{ divider.setPointerCapture&&divider.setPointerCapture(e.pointerId) }catch{}
      if(document.body&&document.body.classList) document.body.classList.add('resizing')
      if(e&&e.preventDefault) e.preventDefault()
    })
    divider.addEventListener('pointermove',e=>{
      if(!dragging) return
      const pr=pages.getBoundingClientRect()
      setW(clampW(pr.right - e.clientX))
    })
    const end=()=>{
      if(!dragging) return
      dragging=false
      if(document.body&&document.body.classList) document.body.classList.remove('resizing')
      lsSet(KEY,String(Math.round(curW)))
    }
    divider.addEventListener('pointerup',end)
    divider.addEventListener('pointercancel',end)
    divider.addEventListener('dblclick',()=>{ setW(DEF); lsDel(KEY) }) // reset affordance (spec §83)
  }catch(e){ /* never let layout wiring break the app / the render gate */ }
})()

// ── draggable board boundary #2: #ctxnav (outline) ↔ #ctxwin (center) ────────────
// Q1 / spec 1.2 §maindiv: a second gutter inside <main>. Independent of #divider — its own
// CSS var (--outline-w) + its own localStorage key. Same defensive construction as above so
// the headless render gate imports without throwing.
;(function(){
  try{
    const KEY='atrace.split.outline', DEF=270, MIN=160
    const md=document.getElementById('maindiv'), main=document.querySelector('main')

    const setW=w=>{ curW=w; if(root&&root.style&&root.style.setProperty) root.style.setProperty('--outline-w',w+'px') }
    const lsGet=k=>{ try{ return (typeof localStorage!=='undefined')?localStorage.getItem(k):null }catch{ return null } }
    const lsSet=(k,v)=>{ try{ if(typeof localStorage!=='undefined') localStorage.setItem(k,v) }catch{} }
    const lsDel=k=>{ try{ if(typeof localStorage!=='undefined') localStorage.removeItem(k) }catch{} }
    const clampW=w=>{
      let max=560
      try{ const mr=main&&main.getBoundingClientRect&&main.getBoundingClientRect(); if(mr&&mr.width) max=Math.min(560,mr.width-360) }catch{}
      if(!(max>MIN)) max=MIN
      return Math.max(MIN,Math.min(max,(isFinite(w)?w:DEF)))
    }
    const saved=parseFloat(lsGet(KEY))
    if(saved>0) setW(clampW(saved))
    if(!md||!main) return
    let dragging=false
    md.addEventListener('pointerdown',e=>{
      dragging=true
      try{ md.setPointerCapture&&md.setPointerCapture(e.pointerId) }catch{}
      if(document.body&&document.body.classList) document.body.classList.add('resizing')
      if(e&&e.preventDefault) e.preventDefault()
    })
    md.addEventListener('pointermove',e=>{
      if(!dragging) return
      const mr=main.getBoundingClientRect()
      setW(clampW(e.clientX - mr.left))
    })
    const end=()=>{
      if(!dragging) return
      dragging=false
      if(document.body&&document.body.classList) document.body.classList.remove('resizing')
      lsSet(KEY,String(Math.round(curW)))
    }
    md.addEventListener('pointerup',end)
    md.addEventListener('pointercancel',end)
    md.addEventListener('dblclick',()=>{ setW(DEF); lsDel(KEY) })
  }catch(e){ /* never let layout wiring break the app / the render gate */ }
})()

// D26: transparent-monitoring control. Only appears when the server was started with --control;
// otherwise (plain read-only viewer) the pill stays hidden. The toggle POSTs the CSRF token the
// status endpoint issues. Non-destructive on a read-only server — /control/status simply 404/errs.
function renderMon(el,d){
  const m=(d&&d.monitoring)||{}, on=!!m.active
  el.innerHTML=`<span class="mondot ${on?'on':''}" title="透明监测 ${on?'开启中':'已关闭'}"></span>`
    +`<button class="monbtn" id="monBtn">监测 ${on?'ON':'OFF'}</button>`
    +`<span class="monwhere" title="透明监测把被测流量转发到的真实上游端点">→ ${esc(m.forwardingTarget||'—')}</span>`
    +(m.autostart?`<span class="monbadge" title="已加入用户级开机自启(非全机)">开机自启</span>`:m.autostartError?`<span class="monbadge" style="color:var(--amber)" title="${esc(m.autostartError)}">开机自启 ?</span>`:'')
    +(m.caTrusted===true?`<span class="monbadge" title="采集 CA 已装入用户级信任库(非全机弱化 TLS)">CA✓</span>`
      :m.caTrusted===false?`<span class="monbadge" style="color:var(--red)" title="采集 CA 不在用户级信任库里 · the capture CA is not in the user trust store">CA ✗</span>`
      :m.caTrusted===null?`<span class="monbadge" style="color:var(--amber)" title="CA 信任态查不出 · could not check the CA trust">CA ? ${esc(m.caError||'')}</span>`:'')
    +(m.nodeExtraCaCerts&&m.nodeExtraCaCerts.matches===false?`<span class="monbadge" style="color:var(--red)" title="node 版 agent 实际信任的是登录会话的 NODE_EXTRA_CA_CERTS:现为 ${esc(m.nodeExtraCaCerts.value||'(未设)')},应为 ${esc(m.nodeExtraCaCerts.expected||'')}">NODE_EXTRA_CA_CERTS ✗</span>`
      :m.nodeExtraCaCerts&&m.nodeExtraCaCerts.matches===null?`<span class="monbadge" style="color:var(--amber)" title="${esc(m.nodeExtraCaCerts.error||'')}">NODE_EXTRA_CA_CERTS ?</span>`:'')
    +(m.steerError?`<span class="monbadge" style="color:var(--amber)" title="${esc(m.steerError)}">steer ? 读不出</span>`:'')
  const btn=document.getElementById('monBtn'); if(!btn) return
  btn.onclick=async()=>{ // 开就是开、关就是关 — 直接切,无确认框(服务端 CSRF/Host/Origin 门才是护栏)
    const action=on?'off':'on'
    btn.textContent='…'; btn.disabled=true
    try{
      await fetch('/control/monitoring',{method:'POST',headers:{'content-type':'application/json','x-asight-csrf':d.csrf},body:JSON.stringify({action})})
      const s=await fetch('/control/status',{cache:'no-store'}); if(s.ok) renderMon(el, await s.json())
    }catch(e){ btn.disabled=false; btn.textContent='监测 ✗' }
  }
}
// BUG 3 (audit 2026-07-19): probed EXACTLY ONCE, at boot — never from poll()'s 1.5s loop (the audit
// suspected a 404-per-cycle; measured, it was already one-shot, and control-availability.test.mjs
// now pins that). The real defect was the failure path: a bare `return` left the pill
// `display:none` forever, so on a read-only server (D26 control is opt-in) the user could not tell
// "monitoring control is off" from "this build has no such feature" — a silent failure, which is
// what 不变式4 forbids the UI to do. Now it says so once and stays inert: no toggle is rendered,
// because a button that cannot work is worse than no button.
;(async()=>{ const el=document.getElementById('monctl'); if(!el) return
  let r=null
  try{ r=await fetch('/control/status',{cache:'no-store'}) }catch(e){ r=null }
  if(r&&r.ok){ try{ const d=await r.json(); el.style.display=''; renderMon(el,d); return }catch(e){ /* malformed → fall through to the honest unavailable pill */ } }
  el.style.display=''
  el.innerHTML=`<span class="mondot" title="监测控制未启用"></span>`
    +`<span class="monwhere" title="This board was started read-only, so the D26 control endpoints are not mounted. Restart the server with --control to arrange transparent monitoring from here. Either way the board keeps showing what was captured — only the on/off switch is absent.">监测控制未启用 · control not enabled${r?` · HTTP ${r.status}`:''} — read-only board</span>`
})()

// ── D38 capture health (1.2 顶栏 #caphealth · 1.5 状态矩阵 · 4.4 /api/capture-health) ─────────────────────────
// Its OWN 1.5 s timer: not the "live" checkbox, not poll() (which returns early on an empty board, in the control view
// and when the session did not change — a capture that stopped would leave the last ✓ frozen there). Never empty;
// no "seen" state, no alert (Non-Goal): it says what holds now and what failed in 24 h. The state and N come from
// the server (src/health/, the reader `asight collector status` uses); this only words them.
const CAPH_MS=1500
let capH=null, capHOkAt=null, capHErr=null, capHBusy=false
const fmtWhen=ts=>{ if(!ts) return '—'; const d=new Date(ts); if(isNaN(d)) return String(ts); return d.toDateString()===new Date().toDateString()?d.toLocaleTimeString():d.toLocaleString() }
// → {cls, text}: cls ok | warn | bad | dim
function capHealthView(h,{okAt,err,now}){
  if(okAt!=null&&now-okAt>2*CAPH_MS) return {cls:'warn',text:`? 未刷新 · 截至 ${fmtWhen(okAt)}`}
  if(err&&okAt==null) return {cls:'warn',text:`? 未刷新 · 截至 —`}
  if(!h) return {cls:'dim',text:'? 采集健康 · 读取中'}
  if(h.unreadable) return {cls:'warn',text:`? 健康读不出:${h.unreadable}`}
  const s=h.summary||{}, legacy=s.part==='legacy', tail=s.read_errors?' · 读不全':'', oldName=s.source==='proxy'?'旧反代':'旧 MITM'
  const t={
    ok:()=>({cls:'ok',text:legacy?`✓ ${oldName} · 最后启动于 ${fmtWhen(s.since)}`:`✓ 采集中 · 自 ${fmtWhen(s.since)} 起`}),
    failing:()=>({cls:'bad',text:`⚠ ${s.n}`}),
    off:()=>({cls:'dim',text:`○ 采集关 · 自 ${fmtWhen(s.since)} 起`}),
    'not-running':()=>({cls:'bad',text:`✗ ${legacy?oldName:'采集器'}没在跑 · 最后记录于 ${fmtWhen(s.since)}${s.signal?` · 因 ${s.signal}`:''}`}),
    stopped:()=>({cls:'dim',text:`○ 旧采集停了 · 自 ${fmtWhen(s.since)} 起`}),
    'not-responding':()=>({cls:'bad',text:`✗ 采集器没响应 · 最后心跳 ${fmtWhen(s.since)}`}),
    unknown:()=>({cls:'warn',text:`? ${legacy?'旧采集':'采集器'}状态不明 · ${s.reason||''}`}),
    'no-events':()=>({cls:'warn',text:'? 旧采集 · 没有事件记录(重启后才有)'}),
    residue:()=>({cls:'warn',text:`– 未安装 · 残留 ${s.n} 项`}),
    'not-installed':()=>({cls:'dim',text:'– 未安装'}),
  }[s.state]
  const v=t?t():{cls:'warn',text:`? ${s.state||'unknown state'}`}
  return {cls:v.cls,text:v.text+tail}
}
function renderCapHealth(){
  const el=document.getElementById('caphealth'); if(!el) return
  const v=capHealthView(capH,{okAt:capHOkAt,err:capHErr,now:Date.now()})
  el.className='caphealth '+v.cls; el.textContent=v.text
  el.title=`capture health (D38) — ${v.text}${capHErr?`\nlast attempt failed: ${capHErr}`:''}${capHOkAt?`\nread at ${fmtWhen(capHOkAt)}`:''}\nclick: the 采集健康 list (⚙ session-less)`
}
async function pollCapHealth(){
  renderCapHealth() // a request that hangs still lets "未刷新" appear on time
  if(capHBusy) return
  capHBusy=true
  try{
    const r=await fetch('/api/capture-health',{cache:'no-store'})
    const j=await r.json().catch(()=>null)
    if(r.status===503&&j&&j.error){ capH={unreadable:j.error}; capHOkAt=Date.now(); capHErr=null }
    else if(r.ok&&j&&j.summary){ capH=j; capHOkAt=Date.now(); capHErr=null }
    else capHErr=(j&&j.error)||('HTTP '+r.status)
  }catch(e){ capHErr=String(e&&e.message||e) }
  finally{ capHBusy=false }
  renderCapHealth()
  if(curSel==='__caphealth__') renderCapHealthView() // its own data: refreshed even with "live" unchecked
  else if(boardEmpty) renderEmpty(emptyMessage())
}
document.getElementById('caphealth').onclick=()=>{ curSel='__caphealth__'; const sel=document.getElementById('fileSel'); sel.dataset.sig=''; closeDetail(); poll() }
pollCapHealth()
setInterval(pollCapHealth,CAPH_MS)

poll()
setInterval(()=>{if(document.getElementById('liveChk').checked)poll()},1500)

// auto-reload when the dashboard's own code (index.html) is redeployed, so you never sit on a
// stale tab after a deploy. (analyze now runs server-side — the browser has no analyze.mjs asset.)
let assetSig=null
async function checkAssets(){
  try{
    const a=await fetch('/index.html',{cache:'no-store'}).then(r=>r.text())
    const sig=String(a.length)
    if(assetSig!==null && sig!==assetSig){ location.reload() }
    assetSig=sig
  }catch{}
}
setInterval(checkAssets,4000)
</script>
