<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>asight — agent context oscilloscope</title>
<style>
  :root {
    --bg:#0e0f13; --panel:#16181f; --panel2:#1c1f28; --rail:#12141a;
    --fg:#e6e8ee; --dim:#9096a6; --dimmer:#5b6070; --border:#262a35;
    --accent:#7aa2f7; --green:#9ece6a; --amber:#e0af68; --cyan:#7dcfff;
    --purple:#bb9af7; --pink:#f7768e; --red:#f7768e;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light){:root{
    --bg:#eef0f4; --panel:#fff; --panel2:#f3f5f9; --rail:#f7f8fb;
    --fg:#1a1d26; --dim:#5c6270; --dimmer:#99a0af; --border:#dde1ea;
    --accent:#3b5bdb; --green:#2f9e44; --amber:#b47407; --cyan:#0c8599;
    --purple:#6f42c1; --pink:#d6336c; --red:#e03131;
  }}
  :root[data-theme="dark"]{--bg:#0e0f13;--panel:#16181f;--panel2:#1c1f28;--rail:#12141a;--fg:#e6e8ee;--dim:#9096a6;--dimmer:#5b6070;--border:#262a35;--accent:#7aa2f7;--green:#9ece6a;--amber:#e0af68;--cyan:#7dcfff;--purple:#bb9af7;--pink:#f7768e;--red:#f7768e;}
  :root[data-theme="light"]{--bg:#eef0f4;--panel:#fff;--panel2:#f3f5f9;--rail:#f7f8fb;--fg:#1a1d26;--dim:#5c6270;--dimmer:#99a0af;--border:#dde1ea;--accent:#3b5bdb;--green:#2f9e44;--amber:#b47407;--cyan:#0c8599;--purple:#6f42c1;--pink:#d6336c;--red:#e03131;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.5;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .mono{font-family:var(--mono);}
  header{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap;}
  /* D26 transparent-monitoring control (only shown when the server's control plane is enabled) */
  .monctl{display:inline-flex;align-items:center;gap:7px;font-size:11px;padding:3px 8px;border:1px solid var(--border);border-radius:7px;background:var(--bg);}
  .monctl .mondot{width:8px;height:8px;border-radius:50%;background:var(--dimmer);box-shadow:0 0 0 2px var(--panel);}
  .monctl .mondot.on{background:#39d353;}
  .monbtn{font:inherit;font-size:11px;cursor:pointer;background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:5px;padding:2px 8px;}
  .monbtn:hover{border-color:var(--fg);}
  .monwhere{color:var(--dim);font-family:var(--mono,monospace);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .monbadge{color:var(--dimmer);font-size:9px;border:1px solid var(--border);border-radius:4px;padding:0 4px;}
  /* D38 capture health (1.2 顶栏 / 1.5): never empty; a disclosure, not an alert — no blinking, no sound */
  .caphealth{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--dim);cursor:pointer;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis;}
  .caphealth.ok{color:var(--green);} .caphealth.warn{color:var(--amber);border-color:var(--amber);} .caphealth.bad{color:var(--red);border-color:var(--red);}
  h1{font-family:var(--mono);font-size:16px;margin:0;letter-spacing:.5px;font-weight:600;}
  h1 b{color:var(--accent);}
  .spacer{flex:1;}
  select,button{font:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:3px 8px;max-width:340px;}
  button{cursor:pointer;} button:disabled{opacity:.4;cursor:default;}
  .live{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:11px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dimmer);}
  .dot.on{background:var(--green);box-shadow:0 0 6px var(--green);}
  .stats{display:flex;gap:14px;font-size:11px;color:var(--dim);}
  .stats b{color:var(--fg);font-family:var(--mono);}
  .sesstitle{font-size:12px;color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sessmeta{font-size:10px;color:var(--dim);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* top-bar identity (point 6): agent type · path · session name · fork/branch */
  .ident{display:flex;align-items:center;gap:8px;min-width:0;max-width:52vw;}
  .agentchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:2px 9px;white-space:nowrap;color:var(--fg);}
  .forkchip{font-size:10px;background:color-mix(in srgb,var(--amber) 12%,transparent);border:1px solid color-mix(in srgb,var(--amber) 40%,var(--border));color:var(--amber);border-radius:20px;padding:2px 8px;white-space:nowrap;font-family:var(--mono);cursor:default;}
  .idchip{font-size:9px;color:var(--dimmer);font-family:var(--mono);}

  /* main conversation sawtooth */
  #saw{background:var(--rail);border-bottom:1px solid var(--border);padding:6px 12px 4px;user-select:none;}
  .sawrow{display:flex;align-items:flex-end;gap:1px;height:74px;cursor:pointer;position:relative;}
  .bar{flex:1 1 0;min-width:2px;position:relative;opacity:.62;border-radius:2px 2px 0 0;transition:opacity .1s;display:flex;flex-direction:column-reverse;overflow:hidden;}
  .bar>span{display:block;width:100%;}
  .bar.cur{opacity:1;outline:2px solid var(--fg);outline-offset:0;z-index:2;}
  .bar:hover{opacity:.85;}
  .bar.reviewed{opacity:.95;box-shadow:inset 0 0 0 1.5px var(--pink);}
  .bar.err{background:var(--red);opacity:.8;}
  /* context-type colors (stacked bar segments + legend swatches) */
  .ct-tools{background:var(--amber);} .ct-system{background:var(--purple);} .ct-user{background:var(--accent);}
  .ct-assistant{background:var(--green);} .ct-thinking{background:var(--pink);} .ct-tool_use{background:var(--cyan);}
  .ct-tool_result{background:var(--dim);} .ct-image{background:var(--dimmer);}
  /* an unrecognized block role — shown as its own colour, never mis-coloured as user/system */
  .ct-other{background:repeating-linear-gradient(45deg,var(--dimmer) 0 2px,transparent 2px 4px);}
  /* a call whose body was not shipped on this page (paged_out): composition UNKNOWN, not empty */
  .ct-unloaded{background:repeating-linear-gradient(45deg,var(--dim) 0 3px,transparent 3px 6px);opacity:.55;}
  .barlegend{display:flex;gap:6px;font-size:9px;color:var(--dim);align-items:center;flex-wrap:wrap;}
  .barlegend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:2px;vertical-align:middle;}
  .bar.err::after{content:"⚠";position:absolute;top:-15px;left:50%;transform:translateX(-50%);color:var(--red);font-size:10px;}
  .bar.compact::after{content:"✂";position:absolute;top:-15px;left:50%;transform:translateX(-50%);color:var(--red);font-size:11px;}
  .ev.err{background:color-mix(in srgb,var(--red) 10%,transparent);border:1px solid color-mix(in srgb,var(--red) 40%,var(--border));border-radius:8px;padding:5px 8px;margin:4px 0;}
  .ev.err .ic{color:var(--red);}
  .ev.errgroup{background:color-mix(in srgb,var(--red) 7%,transparent);border-style:dashed;opacity:.9;}
  #reviewbracket{position:absolute;left:0;bottom:-3px;height:3px;background:var(--pink);display:none;border-radius:2px;pointer-events:none;z-index:3;}
  /* per-call cache reading — one cell per call, 1:1 under the bars (same flex axis → aligned) */
  .cacherow{display:flex;gap:1px;height:5px;margin-top:2px;}
  .cbar{flex:1 1 0;min-width:2px;border-radius:1px;background:var(--dimmer);opacity:.45;}
  .cbar.hi{background:var(--green);opacity:.9;} .cbar.mid{background:var(--amber);opacity:.85;} .cbar.lo{background:var(--red);opacity:.8;}
  .cbar.cur{outline:1px solid var(--fg);outline-offset:0;}
  .sawaxis{display:flex;justify-content:space-between;color:var(--dimmer);font-size:9px;margin-top:2px;font-family:var(--mono);}
  /* D13 overview strip + brush (focus+context navigator) */
  .ovstrip{position:relative;height:24px;margin-top:3px;border:1px solid var(--border);border-radius:3px;background:color-mix(in srgb,var(--panel) 60%,transparent);overflow:hidden;touch-action:none;}
  .ovbars{display:flex;align-items:flex-end;gap:0;height:100%;padding:1px;}
  .ovbar{flex:1 1 0;min-width:0;background:var(--dim);opacity:.5;border-radius:1px 1px 0 0;}
  .ovbar.err{background:var(--red);opacity:.6;}
  .ovsvg{position:absolute;inset:1px;width:calc(100% - 2px);height:calc(100% - 2px);}
  .ovsvg polyline{fill:none;stroke:var(--dim);stroke-width:.8;opacity:.75;vector-effect:non-scaling-stroke;}
  .ovsample{position:absolute;top:1px;right:3px;font-size:8px;color:var(--amber);font-family:var(--mono);opacity:.85;pointer-events:none;}
  .ovpin{position:absolute;top:0;bottom:0;width:1px;background:var(--fg);opacity:.55;pointer-events:none;}
  .ovbrush{position:absolute;top:0;bottom:0;min-width:6px;background:color-mix(in srgb,var(--accent) 22%,transparent);border:1px solid var(--accent);border-radius:2px;cursor:grab;box-sizing:border-box;}
  .ovbrush:active{cursor:grabbing;}
  .ovh{position:absolute;top:-1px;bottom:-1px;width:7px;cursor:col-resize;background:var(--accent);opacity:.55;}
  .ovh-l{left:-1px;border-radius:2px 0 0 2px;} .ovh-r{right:-1px;border-radius:0 2px 2px 0;}
  .ovh:hover{opacity:.9;}
  .sawlegend{display:flex;gap:12px;font-size:10px;color:var(--dim);margin-top:3px;flex-wrap:wrap;align-items:center;}
  .navbtns{display:flex;gap:4px;align-items:center;margin-left:auto;}
  /* shared timeline grid: fixed left gutter (track titles) | aligned plotting lane (point 3) */
  #saw,#rails{--gut:140px;}
  .trow{display:grid;grid-template-columns:var(--gut) 1fr;align-items:center;column-gap:8px;}
  .trow-bars{align-items:end;}
  .tgut{font-size:10px;color:var(--dim);text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:2px;}
  .tgut-ctx{font-family:var(--mono);color:var(--fg);}
  .tlane{position:relative;min-width:0;}
  .railname{text-align:left;cursor:pointer;color:var(--dim);display:flex;align-items:center;gap:5px;}
  .railname:hover{color:var(--fg);} .railname.col{opacity:.72;}
  .railname .rc{font-family:var(--mono);font-size:9px;color:var(--dimmer);}
  .railname .rflag{color:var(--red);font-family:var(--mono);font-size:9px;}

  /* lane rails — every other lane of this session, time-aligned under the conversation */
  #rails{background:var(--rail);border-bottom:1px solid var(--border);padding:2px 12px 6px;user-select:none;}
  .rail{border-top:1px solid var(--border);}
  .subgrouphd b{color:var(--amber);font-weight:600;}
  .subgroup .subkids{margin-left:12px;border-left:2px solid color-mix(in srgb,var(--amber) 30%,var(--border));padding-left:4px;}
  .subgroup .subkids .rail{border-top:1px dashed color-mix(in srgb,var(--border) 70%,transparent);}
  .railhead{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);cursor:pointer;padding:4px 0 2px;}
  .railhead:hover{color:var(--fg);}
  .railhead .rc{font-family:var(--mono);font-size:10px;color:var(--dimmer);}
  .railhead .rflag{color:var(--red);font-family:var(--mono);font-size:10px;}
  .railhead .rkind{margin-left:auto;font-size:9px;color:var(--dimmer);font-style:italic;}
  .railbody{position:relative;height:20px;margin-bottom:3px;border-radius:4px;cursor:pointer;background:color-mix(in srgb,var(--fg) 3%,transparent);}
  .railbody:hover{background:color-mix(in srgb,var(--fg) 7%,transparent);}
  .rail.k-probe .railbody{height:28px;}
  .tick{position:absolute;top:5px;width:9px;height:9px;border-radius:50%;background:var(--dim);transform:translateX(-50%);cursor:pointer;border:1.5px solid var(--rail);}
  .rail.k-monitor .tick{background:var(--pink);} .rail.k-aux .tick{background:var(--dimmer);} .rail.k-subagent .tick{background:var(--amber);}
  .rail.k-notify .tick{background:var(--green);} .rail.k-titlegen .tick{background:var(--cyan);} .rail.k-quota .tick{background:var(--dimmer);opacity:.6;}
  #detail.k-notify{border-top-color:var(--green);} #detail.k-titlegen{border-top-color:var(--cyan);} #detail.k-quota{border-top-color:var(--dimmer);}
  .tick:hover,.tick.sel{outline:2px solid var(--fg);z-index:2;}
  .tick.flag{background:var(--red);box-shadow:0 0 6px var(--red);}
  .tick.errtick{background:var(--red)!important;opacity:.85;width:6px;height:6px;top:7px;}
  .pbar{position:absolute;bottom:0;width:2px;background:var(--cyan);opacity:.45;transform:translateX(-50%);cursor:pointer;border-radius:1px 1px 0 0;}
  .pbar:hover,.pbar.sel{opacity:1;}

  /* B layout: left page (replay backbone) | divider | right page (overlays as wing) */
  #pages{flex:1;display:flex;min-height:0;}
  #leftpage{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
  #divider{flex:none;width:6px;cursor:col-resize;background:repeating-linear-gradient(180deg,var(--border) 0 4px,transparent 4px 8px);touch-action:none;}
  #divider:hover{background:var(--accent);}
  body.resizing{cursor:col-resize;user-select:none;}
  body.resizing #ctxwin,body.resizing #resexp{pointer-events:none;}
  #rightpage{flex:none;width:var(--rightpage-w,320px);display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--border);background:var(--panel);}
  #resexp{flex:1;overflow-y:auto;padding:9px 10px 30px;}
  #rawpanel{flex:none;max-height:42%;overflow-y:auto;border-top:1px solid var(--border);background:var(--rail);padding:8px 10px;}
  .rphd{font-family:var(--mono);font-size:11px;color:var(--fg);margin-bottom:4px;}
  .rpk{font-size:10.5px;color:var(--dim);margin:2px 0;} .rpk b{color:var(--fg);font-family:var(--mono);}
  .rpcost b{color:var(--amber);}
  /* D14 花费保真标:虚线徽章 = 非线上事实,本地估价(可编辑单价) */
  .estbadge{font-size:9px;color:var(--amber);border:1px dashed color-mix(in srgb,var(--amber) 45%,var(--border));border-radius:10px;padding:0 5px;cursor:help;white-space:nowrap;margin-left:4px;}
  .rpempty{font-size:10px;color:var(--dimmer);}
  .viewname{cursor:pointer;} .viewname:hover{text-decoration:underline;color:var(--fg);}
  .viewbtn{cursor:pointer;opacity:.45;font-size:10px;margin-left:4px;} .viewbtn:hover{opacity:1;}
  .rawpre{font-family:var(--mono);font-size:10px;line-height:1.45;white-space:pre-wrap;word-break:break-word;color:var(--dim);margin:5px 0 0;}
  .rpx{float:right;cursor:pointer;color:var(--dimmer);font-size:9px;border:1px solid var(--border);border-radius:5px;padding:0 5px;} .rpx:hover{color:var(--fg);}
  .resz{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--dimmer);margin:0 0 5px;}
  body.ctrlmode #rightpage,body.ctrlmode #divider{display:none;}
  @media(max-width:900px){#pages{flex-direction:column;} #rightpage{width:auto;max-height:38vh;border-left:none;border-top:1px solid var(--border);} #divider{display:none;}}

  /* session mode: nav sidebar + the ONE faithful context window. control mode: timeline + ledger. */
  main{flex:1;display:grid;grid-template-columns:var(--outline-w,270px) 6px 1fr;min-height:0;}
  body.ctrlmode main{grid-template-columns:1fr 356px;}
  @media(max-width:820px){main{grid-template-columns:1fr;} #ctxnav,#maindiv{display:none;}}
  /* outline ↔ center adjustable boundary (Q1) — second draggable gutter, own CSS var + LS key */
  #maindiv{cursor:col-resize;background:repeating-linear-gradient(180deg,var(--border) 0 4px,transparent 4px 8px);touch-action:none;}
  #maindiv:hover{background:var(--accent);}
  body.ctrlmode #maindiv{display:none;}
  #ctxnav{overflow-y:auto;border-right:1px solid var(--border);background:var(--panel);padding:10px 9px 40px;}
  #ctxwin{overflow-y:auto;padding:12px 20px 60px;}
  body.ctrlmode #ctxnav,body.ctrlmode #ctxwin{display:none;}
  #timeline,#ledger{display:none;}
  body.ctrlmode #timeline{display:block;overflow-y:auto;padding:14px 18px;}
  body.ctrlmode #ledger{display:block;overflow-y:auto;border-left:1px solid var(--border);background:var(--panel);padding:12px 14px;}

  /* ── the context window (tools → system → messages, faithful order) ── */
  .cwmeta{border-bottom:1px solid var(--border);padding-bottom:9px;margin-bottom:6px;}
  .cwtitle{font-family:var(--mono);font-size:12.5px;color:var(--fg);}
  .cwtitle b{color:var(--accent);}
  .cwsub{font-size:10.5px;color:var(--dim);margin-top:2px;}
  .cwsub b{color:var(--fg);font-family:var(--mono);}
  .cwcache{font-size:11px;color:var(--dim);margin-top:6px;background:color-mix(in srgb,var(--cyan) 8%,transparent);border:1px solid color-mix(in srgb,var(--cyan) 24%,var(--border));border-radius:6px;padding:5px 9px;}
  .cwcache b{font-family:var(--mono);color:var(--fg);} .cwcache .chit{color:var(--cyan);}
  .cwsec{display:flex;align-items:baseline;gap:8px;margin:16px 0 6px;padding-top:8px;border-top:2px solid var(--border);scroll-margin-top:8px;}
  .cwsec b{font-size:11px;letter-spacing:1.5px;color:var(--fg);}
  .cwsecic{font-size:13px;} .cwsecn{font-family:var(--mono);font-size:10px;color:var(--dimmer);}
  .cwsecd{font-size:10px;color:var(--dimmer);font-style:italic;margin-left:auto;text-align:right;max-width:45%;}
  .cwsecw{font-family:var(--mono);font-size:9.5px;color:var(--dim);white-space:nowrap;}
  .cwsecest{color:var(--dimmer);font-style:italic;}
  /* D17② schema-tax summary */
  .cwtax{margin-top:7px;}
  .taxbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--rail);border:1px solid var(--border);}
  .taxseg{display:block;height:100%;}
  .taxseg-tools{background:var(--amber);} .taxseg-system{background:var(--purple);} .taxseg-history{background:var(--dim);} .taxseg-task{background:var(--accent);}
  .taxlegend{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;font-size:9.5px;color:var(--dim);}
  .taxlg{display:inline-flex;align-items:center;gap:4px;} .taxlg i{width:8px;height:8px;border-radius:2px;display:inline-block;} .taxlg b{font-family:var(--mono);color:var(--fg);}
  .taxculprit{font-size:10px;color:var(--dim);margin-top:4px;} .taxculprit b{font-family:var(--mono);color:var(--amber);}
  .taxest{color:var(--dimmer);font-style:italic;font-size:9px;margin-left:6px;}
  .cwgrowth{font-size:10px;color:var(--dim);margin-top:5px;} .cwgrowth b{font-family:var(--mono);color:var(--fg);}
  /* 步间 diff (2.3/D24): reference picker + removal-aware section */
  .cwdiff{font-size:10px;color:var(--dim);margin-top:5px;display:flex;align-items:center;gap:5px;} .cwdiff b{font-family:var(--mono);color:var(--fg);}
  .diffbtn{font-size:10px;background:transparent;border:1px solid var(--border);color:var(--dim);border-radius:5px;padding:0 5px;cursor:pointer;line-height:1.5;} .diffbtn:hover{color:var(--fg);border-color:var(--fg);}
  .cwrem-n{font-size:9px;color:var(--amber,#e8c15a);border:1px solid color-mix(in srgb,var(--amber,#e8c15a) 35%,transparent);border-radius:8px;padding:0 6px;font-family:var(--mono);}
  .cwremoved{margin:6px 0;border:1px dashed color-mix(in srgb,var(--amber,#e8c15a) 40%,transparent);border-radius:6px;background:color-mix(in srgb,var(--amber,#e8c15a) 6%,transparent);}
  .cwremhd{font-size:10px;color:var(--amber,#e8c15a);padding:5px 9px;cursor:pointer;} .cwremhd b{font-family:var(--mono);}
  .cwrembody{padding:0 8px 6px;} .cblk.removed{opacity:.72;} .cblk.removed .cbh{text-decoration:line-through solid color-mix(in srgb,var(--amber,#e8c15a) 50%,transparent);}
  .rembadge{font-size:8.5px;color:var(--amber,#e8c15a);border:1px solid color-mix(in srgb,var(--amber,#e8c15a) 40%,transparent);border-radius:8px;padding:0 5px;white-space:nowrap;font-family:var(--mono);text-decoration:none;}
  .cwgrowth.compact b{color:var(--amber);}
  .cwgrowth.off{color:var(--amber);} .cwgrowth.off .diffbtn{margin-left:6px;}
  .lifemark{font-size:8.5px;color:var(--green);border:1px solid color-mix(in srgb,var(--green) 35%,transparent);border-radius:8px;padding:0 5px;white-space:nowrap;font-family:var(--mono);}
  /* one block */
  .cblk{border:1px solid var(--border);border-radius:6px;margin-bottom:4px;overflow:hidden;background:var(--panel);scroll-margin-top:8px;}
  .cblk.s-tools{background:color-mix(in srgb,var(--amber) 4%,transparent);}
  .cblk.s-system{background:color-mix(in srgb,var(--purple) 5%,transparent);}
  .cblk.hl{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent);}
  .cbh{display:flex;gap:7px;align-items:center;padding:4px 9px;font-family:var(--mono);font-size:10.5px;color:var(--dim);cursor:pointer;}
  .cbh:hover{color:var(--fg);}
  .cbh::before{content:"▸";color:var(--dimmer);font-size:9px;width:8px;}
  .cblk:not(.collapsed) .cbh::before{content:"▾";}
  .cbrole{color:var(--fg);font-weight:600;min-width:0;}
  .cbtag{color:var(--dimmer);}
  .cblabel{color:var(--cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;}
  .cbchars{margin-left:auto;color:var(--dimmer);font-size:9px;white-space:nowrap;}
  .ccbadge{color:var(--green);font-size:9px;white-space:nowrap;border:1px solid color-mix(in srgb,var(--green) 40%,var(--border));border-radius:10px;padding:0 5px;}
  .volbadge{color:var(--amber);font-size:9px;white-space:nowrap;border:1px solid color-mix(in srgb,var(--amber) 40%,var(--border));border-radius:10px;padding:0 5px;}
  .metabadge{color:var(--dim);font-size:9px;white-space:nowrap;border:1px dashed var(--border);border-radius:10px;padding:0 5px;cursor:help;}
  /* per-block faithfulness (1.4:52 / 不变式4): dashed = NOT byte-verbatim. Muted amber so it reads as a caveat, not an error. */
  .ffbadge{font-size:9px;white-space:nowrap;border:1px dashed color-mix(in srgb,var(--amber) 45%,var(--border));border-radius:10px;padding:0 5px;cursor:help;color:var(--amber);}
  .ff-opaque{color:var(--dim);border-color:color-mix(in srgb,var(--dim) 45%,var(--border));}
  .cbc{padding:0 9px;} .cblk.collapsed .cbc{display:none;}
  /* messages grouped into turns (point 2): user-query header ▸ nested call-turn blocks */
  .cwturn{border:1px solid var(--border);border-radius:7px;margin-bottom:6px;overflow:hidden;background:color-mix(in srgb,var(--accent) 3%,transparent);}
  .cwturnhd{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;font-size:11.5px;}
  .cwturnhd::before{content:"▾";color:var(--dimmer);font-size:10px;width:8px;}
  .cwturn.collapsed .cwturnhd::before{content:"▸";}
  .cwturnhd:hover{background:color-mix(in srgb,var(--fg) 4%,transparent);}
  .cwturnq{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;}
  .cwturnq .qk{color:var(--dimmer);font-weight:400;font-family:var(--mono);font-size:9px;margin-left:6px;}
  .cwturnn{color:var(--dimmer);font-size:9px;white-space:nowrap;border:1px solid var(--border);border-radius:10px;padding:0 6px;font-family:var(--mono);}
  .cwturnbody{padding:2px 8px 6px;} .cwturn.collapsed .cwturnbody{display:none;}
  /* D12 全展/全折 便捷键 */
  .cwfoldall{display:flex;gap:6px;justify-content:flex-end;margin:-2px 0 5px;}
  .foldallbtn{background:none;border:1px solid var(--border);border-radius:10px;color:var(--dim);font-size:9px;font-family:var(--mono);padding:1px 7px;cursor:pointer;}
  .foldallbtn:hover{color:var(--fg);border-color:var(--accent);}
  .cbpre{margin:2px 0 7px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;color:var(--fg);}
  .cbc .md{padding:3px 0 7px;font-size:12px;}
  /* role accents on the message blocks */
  .cblk.r-user .cbrole{color:var(--green);} .cblk.r-assistant .cbrole{color:var(--accent);}
  .cblk.k-thinking .cbrole{color:var(--purple);} .cblk.k-tool_use .cbrole{color:var(--amber);} .cblk.k-tool_result .cbrole{color:var(--cyan);}
  .cblk.r-system .cbrole{color:var(--purple);}
  /* the KV-cache break marker */
  .cachemark{display:flex;align-items:center;gap:9px;margin:12px 0 8px;scroll-margin-top:8px;}
  .cachemark .cmline{flex:0 0 auto;width:5px;align-self:stretch;min-height:24px;background:var(--cyan);border-radius:3px;box-shadow:0 0 8px color-mix(in srgb,var(--cyan) 60%,transparent);}
  .cachemark .cmtext{font-size:10.5px;color:var(--cyan);line-height:1.45;}
  .cachemark .cmnote{color:var(--dimmer);font-style:italic;}
  .cachemark.whole .cmline{background:var(--red);box-shadow:0 0 8px color-mix(in srgb,var(--red) 60%,transparent);} .cachemark.whole .cmtext{color:var(--red);}
  .cmwhy{margin-top:4px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;font-size:10px;line-height:1.4;}
  .cmcause{font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid transparent;}
  .cmc-ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent);background:color-mix(in srgb,var(--green) 12%,transparent);}
  .cmc-warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent);background:color-mix(in srgb,var(--amber) 12%,transparent);}
  .cmc-bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent);background:color-mix(in srgb,var(--red) 14%,transparent);}
  .cmloc{color:var(--dim);font-family:var(--mono,monospace);}
  .cmfix{color:var(--dimmer);font-style:italic;}
  .cmest{color:var(--dimmer);font-size:9px;opacity:.75;margin-left:auto;letter-spacing:.3px;}
  .cmhash{color:var(--dim);font-size:9px;font-family:var(--mono);border:1px solid var(--border);border-radius:4px;padding:0 4px;cursor:help;white-space:nowrap;}

  /* ── nav sidebar ── */
  .navz{font-size:9px;text-transform:uppercase;letter-spacing:1.4px;color:var(--dimmer);margin:12px 4px 5px;}
  .navz:first-child{margin-top:2px;}
  .navrow{display:flex;align-items:center;gap:7px;padding:4px 7px;border-radius:6px;cursor:pointer;font-size:11.5px;color:var(--dim);}
  .navrow:hover{background:color-mix(in srgb,var(--accent) 9%,transparent);color:var(--fg);}
  .navrow .navic{width:15px;text-align:center;flex:0 0 auto;}
  .navrow .navlbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .navrow .navct{font-family:var(--mono);font-size:9.5px;color:var(--dimmer);}
  .navrow.head .navlbl{color:var(--fg);font-weight:600;}
  .navrow.head::before{content:"▸";color:var(--dimmer);font-size:9px;margin-right:-2px;}
  .navrow.head.open::before{content:"▾";}
  .navkids{margin:1px 0 4px 12px;border-left:1px solid var(--border);padding-left:4px;}
  .navsub{display:flex;align-items:baseline;gap:6px;padding:3px 6px;border-radius:5px;cursor:pointer;font-size:10.5px;color:var(--dim);font-family:var(--mono);}
  .navsub:hover{background:color-mix(in srgb,var(--accent) 9%,transparent);color:var(--fg);}
  .navsub .nsl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .navsub .nsx{color:var(--dimmer);font-size:9px;white-space:nowrap;}
  .navsub .cc{color:var(--green);} .navsub .vol{color:var(--amber);}
  .navsub.pend{opacity:.42;} .navsub.dead{opacity:.5;text-decoration:line-through;text-decoration-color:var(--dimmer);}
  .navsub .en{color:var(--green);} .navsub .ev{color:var(--red);}
  .navseen{display:flex;flex-wrap:wrap;gap:3px 4px;margin:2px 0 4px 14px;}
  .navchip{font-family:var(--mono);font-size:9.5px;color:var(--dim);background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:0 5px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .navchip:hover{color:var(--fg);border-color:var(--dim);} .navchip.future{opacity:.4;}
  .navmore{font-size:9px;color:var(--dimmer);cursor:pointer;padding:2px 0 2px 14px;font-family:var(--mono);}
  .navmore:hover{color:var(--accent);}
  .res{cursor:pointer;}

  /* react events */
  .ev{display:grid;grid-template-columns:22px 1fr;gap:9px;padding:5px 0;position:relative;}
  .ev .ic{font-size:13px;text-align:center;line-height:1.4;}
  .ev .body{min-width:0;}
  .ev .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);}
  .ev .txt{white-space:pre-wrap;word-break:break-word;}
  .ev pre{margin:3px 0 0;background:var(--panel2);padding:6px 9px;border-radius:6px;font-size:11.5px;font-family:var(--mono);white-space:pre-wrap;word-break:break-word;max-height:200px;overflow:auto;}
  .ev.future{opacity:.34;}
  .ev.cur{background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:8px;margin:0 -8px;padding:5px 8px;}
  .ev.user .ic{color:var(--green);} .ev.user .lbl{color:var(--green);}
  .ev.thought .ic{color:var(--purple);} .ev.thought .lbl{color:var(--purple);} .ev.thought .txt{color:var(--dim);font-style:italic;}
  .ev.say .ic{color:var(--accent);}
  .ev.action .ic{color:var(--amber);} .ev.action .lbl{color:var(--amber);}
  .ev.observation .ic{color:var(--cyan);} .ev.observation .lbl{color:var(--cyan);}
  .ev.spawn .ic{color:var(--pink);} .ev.spawn .lbl{color:var(--pink);}
  .ev.compaction{background:color-mix(in srgb,var(--red) 14%,transparent);border:1px solid var(--red);border-radius:8px;padding:8px 10px;margin:8px 0;grid-template-columns:1fr;}
  .fp{font-family:var(--mono);color:var(--cyan);}
  .stepno{font-family:var(--mono);color:var(--dimmer);font-size:9px;}
  .subinfo{font-size:11px;color:var(--amber);border-left:2px solid var(--amber);padding:3px 0 3px 10px;margin:4px 0;background:color-mix(in srgb,var(--amber) 7%,transparent);border-radius:0 6px 6px 0;}

  /* markdown */
  .md code{font-family:var(--mono);font-size:.92em;background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:0 4px;}
  .md pre.mdc{margin:4px 0;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-word;overflow:auto;}
  .md strong{color:var(--fg);font-weight:600;} .md em{font-style:italic;} .md a{color:var(--cyan);} .md .mdh{font-weight:700;color:var(--fg);}

  /* ledger */
  h2{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:16px 0 7px;display:flex;align-items:center;gap:6px;}
  h2:first-child{margin-top:0;}
  h2 .gi{width:8px;height:8px;border-radius:2px;display:inline-block;} h2 .ct{color:var(--dimmer);font-weight:400;letter-spacing:0;}
  .res{margin-bottom:11px;}
  .res .top{display:flex;gap:6px;align-items:baseline;}
  .res .nm{font-family:var(--mono);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .res .via{font-size:9px;color:var(--dimmer);margin-left:auto;white-space:nowrap;}
  .res.file .nm{color:var(--fg);} .res.scaffold .nm{color:var(--purple);} .res.dir .nm{color:var(--amber);} .res.link .nm{color:var(--cyan);} .res.capability .nm{color:var(--pink);}
  .res.dead{opacity:.45;}
  .pill{font-size:8.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.4px;padding:1px 5px;border-radius:20px;border:1px solid var(--border);}
  .pill.on{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,var(--border));}
  .pill.off{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--border));}
  .pill.pend{color:var(--dimmer);}
  .track{position:relative;height:16px;background:var(--panel2);border-radius:5px;margin-top:4px;overflow:hidden;
    background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),color-mix(in srgb,var(--border) 55%,transparent) calc(10% - 1px),color-mix(in srgb,var(--border) 55%,transparent) 10%);}
  .track .span{position:absolute;top:2px;bottom:2px;background:var(--accent);border-radius:3px;opacity:.55;}
  .res.scaffold .span{background:var(--purple);} .res.dir .span{background:var(--amber);} .res.link .span{background:var(--cyan);} .res.capability .span{background:var(--pink);}
  .track .load{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.85;border-radius:2px;}
  .track .load::after{content:"";position:absolute;top:-1px;left:-1px;width:4px;height:4px;border-radius:50%;background:var(--fg);}
  .track .evict{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--red);}
  .track .ph{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);box-shadow:0 0 4px var(--fg);}
  .res .sub2{display:flex;gap:8px;align-items:baseline;margin-top:3px;}
  .res .ranges{font-family:var(--mono);font-size:9.5px;color:var(--cyan);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .res .hits{font-size:9px;color:var(--dimmer);margin-left:auto;white-space:nowrap;}
  /* opened-file expand */
  .res.file .res-hd{cursor:pointer;}
  .res.file .res-hd .nm::before{content:"▸ ";color:var(--dimmer);}
  .res.file.expanded .res-hd .nm::before{content:"▾ ";}
  .lifesum{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:3px;}
  .lifesum .ev{color:var(--dimmer);}
  .filedetail{display:none;margin:6px 0 2px 10px;border-left:1px solid var(--border);padding-left:9px;}
  .res.file.expanded .filedetail{display:block;}
  .fload{font-family:var(--mono);font-size:10px;color:var(--dim);padding:2px 0;cursor:pointer;display:flex;gap:7px;align-items:baseline;}
  .fload:hover{color:var(--fg);}
  .fload .fk{color:var(--accent);} .fload.evict .fk{color:var(--red);} .fload.reinj .fk{color:var(--green);}
  .fload .fvia{color:var(--dimmer);} .fload .frng{color:var(--cyan);opacity:.85;}
  .res-viewtext{display:inline-block;margin-top:5px;font-size:10px;font-family:var(--mono);color:var(--accent);cursor:pointer;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--border));border-radius:5px;padding:2px 7px;}
  .res-viewtext:hover{background:color-mix(in srgb,var(--accent) 14%,transparent);}
  /* only-seen filenames */
  .seenhint{font-size:9px;color:var(--dimmer);margin:-2px 0 6px;line-height:1.4;}
  .seenlist{display:flex;flex-wrap:wrap;gap:4px 6px;}
  .seenchip{font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
  .seenchip:hover{color:var(--fg);border-color:var(--dim);}
  .seenchip.future{opacity:.38;}
  .seenchip .sdot{color:var(--dimmer);}
  .seenmore{font-size:9.5px;color:var(--dimmer);cursor:pointer;padding:3px 0;font-family:var(--mono);}
  .seenmore:hover{color:var(--accent);}
  /* monitor raw message (原文) with folded transcript */
  .monmsg{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11px;color:var(--fg);background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;}
  .monmsg .collapsible{margin:6px 0;}
  .empty{color:var(--dimmer);padding:40px 12px;text-align:center;}
  /* BUG 1: a call whose body was not shipped on this page. Deliberately NOT styled like .empty —
     "we didn't fetch it" must never look like "there was nothing here" (不变式4). */
  .pagedout{margin:24px auto;max-width:560px;padding:14px 16px;border:1px dashed var(--dim);border-radius:6px;background:rgba(255,255,255,.02);}
  .pohd{font-size:12px;color:var(--amber);margin-bottom:6px;}
  .pobody{font-size:11px;color:var(--dim);line-height:1.6;margin-bottom:10px;}
  .pobtn{font:inherit;font-size:11px;padding:4px 10px;border:1px solid var(--dim);border-radius:4px;background:transparent;color:var(--fg);cursor:pointer;}
  .pobtn:hover{border-color:var(--accent);color:var(--accent);}
  .pobadge{color:var(--amber);border:1px solid var(--amber);border-radius:3px;padding:0 4px;font-size:9px;}
  kbd{font-family:var(--mono);background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:0 5px;font-size:10px;}
  .curmeta{font-family:var(--mono);font-size:10px;color:var(--dim);margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border);}
  .stepdiv{font-family:var(--mono);font-size:9.5px;color:var(--dimmer);margin:11px 0 3px;padding-top:6px;border-top:1px dashed var(--border);letter-spacing:.2px;}
  .stepdiv.curdiv{color:var(--accent);border-top-color:var(--accent);}
  .stepdiv .grow{color:var(--green);} .stepdiv .drop{color:var(--red);font-weight:600;}
  .collapsible{position:relative;padding-left:12px;}
  .collapsible .edge{position:absolute;left:0;top:0;bottom:20px;width:9px;cursor:pointer;border-left:3px solid var(--border);border-radius:3px;}
  .collapsible .edge:hover{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);}
  .collapsible .cwrap{max-height:150px;overflow:hidden;position:relative;}
  .collapsible.open .cwrap{max-height:none;}
  .collapsible:not(.open) .cwrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--panel2));pointer-events:none;}
  .collapsible .more{cursor:pointer;color:var(--dim);font-family:var(--mono);font-size:10px;padding:3px 0 0;user-select:none;}
  .collapsible .more:hover{color:var(--accent);}

  /* lane-call detail panel (slides up from bottom) */
  #detail{position:fixed;left:0;right:0;bottom:0;max-height:48vh;overflow:auto;background:var(--panel);border-top:2px solid var(--accent);box-shadow:0 -10px 30px rgba(0,0,0,.45);padding:12px 20px 18px;transform:translateY(101%);transition:transform .18s ease;z-index:30;}
  #detail.open{transform:none;}
  #detail.k-monitor{border-top-color:var(--pink);} #detail.k-probe{border-top-color:var(--cyan);} #detail.k-aux{border-top-color:var(--dimmer);}
  #detail h3{margin:0 0 8px;font-size:13px;font-family:var(--mono);}
  #detail .dclose{position:absolute;top:10px;right:16px;cursor:pointer;color:var(--dim);border:1px solid var(--border);border-radius:6px;padding:2px 9px;font-size:11px;}
  #detail .din{font-size:11.5px;margin:5px 0;}
  #detail .persona{color:var(--dim);font-style:italic;}
  #detail pre{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 11px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-word;margin:4px 0;}
  #detail .callref{color:var(--accent);cursor:pointer;text-decoration:underline;font-family:var(--mono);}
  #detail .callref:hover{color:var(--fg);}

  /* control-plane (session-less) view */
  .ctrlhdr{font-size:11.5px;color:var(--dim);margin-bottom:12px;line-height:1.55;}
  .ctrlhdr code{font-family:var(--mono);font-size:.9em;background:var(--panel2);border-radius:4px;padding:0 4px;}
  .ctrlsec{border:1px solid var(--border);border-radius:8px;margin-bottom:9px;overflow:hidden;}
  .ctrlsec>summary{cursor:pointer;padding:8px 11px;background:var(--panel2);font-size:12px;display:flex;align-items:center;gap:8px;list-style:none;}
  .ctrlsec>summary::-webkit-details-marker{display:none;}
  .ctrlsec>summary::before{content:"▸";color:var(--dimmer);font-size:10px;}
  .ctrlsec[open]>summary::before{content:"▾";}
  .ctrlsec .cc{font-family:var(--mono);font-size:10px;color:var(--dimmer);}
  .ctrlsec .cwhat{color:var(--dim);font-size:10px;font-style:italic;margin-left:auto;text-align:right;max-width:55%;}
  .ctrlrow{display:flex;gap:10px;align-items:baseline;padding:4px 12px;border-top:1px solid var(--border);font-size:11px;cursor:pointer;font-family:var(--mono);}
  .ctrlrow:hover{background:color-mix(in srgb,var(--accent) 8%,transparent);}
  .ctrlrow .tm{color:var(--dimmer);white-space:nowrap;}
  .ctrlrow .m{color:var(--amber);width:40px;}
  .ctrlrow .ep{color:var(--fg);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ctrlrow .st{color:var(--green);} .ctrlrow .st.err{color:var(--red);}
</style>

<body>
<header>
  <h1><b>a</b>sight</h1>

  <select id="fileSel" title="project · session"></select>
  <div class="ident">
    <span class="agentchip" id="agentChip">🟠 Claude Code</span>
    <div style="min-width:0">
      <div class="sesstitle" id="sessTitle">—</div>
      <div class="sessmeta" id="sessMeta"></div>
    </div>
    <span class="forkchip" id="forkChip" style="display:none"></span>
  </div>

// rough cost estimate ($/Mtok: input, output, cache-write-5m, cache-read) — editable
let PRICING={opus:[15,75,18.75,1.5],sonnet:[3,15,3.75,0.3],haiku:[1,5,1.25,0.1]} // D14: overridden by /api/pricing (editable config); cost = usage × price, derived-only

// model, role]` / 2.2:44 「单价表按 (provider, model) 扩展」. The old priceKey() matched the
// ANTHROPIC family names opus/sonnet/haiku as substrings **with haiku as the fallback**, so every
// OpenAI / DeepSeek model silently got haiku rates and a confident $ figure. A wrong number is
// worse than no number (不变式4): no row for (provider, model) ⇒ NO number, never a guess.
const PRICING_PROVIDER='anthropic' // whose $/Mtok the editable PRICING table above holds
const ANTHROPIC_FAMILY=[[/opus/,'opus'],[/sonnet/,'sonnet'],[/haiku/,'haiku']]
const curProvider=()=>(meta&&meta.provider)||null // observed on the wire server-side; may be null
// priceRow(model, provider) → [in,out,cache_write,cache_read] | null
function priceRow(model,provider){
  const m=String(model||''); if(!m) return null
  const p=(provider===undefined?curProvider():provider)
  // an EXACT model key in the editable table wins for any provider — that is the D14 escape hatch:
  // add "gpt-5.5":[…] to pricing.json / ASIGHT_PRICING and the board prices it for real.
  if(Array.isArray(PRICING[m])) return PRICING[m]

  // Family substrings (opus/sonnet/haiku) are ANTHROPIC model names, so they may only be matched
  // against an Anthropic-shaped MODEL NAME. Gating on the wire dialect (`p`) instead was wrong in
  // both directions: claude-opus-4-6 reached over an OpenAI-Responses endpoint (OpenCode is
  // provider-agnostic) lost its correct opus price, while `sonnet-mini-2` with an unknown dialect
  // still pulled Anthropic rates. The model decides the price; the transport is irrelevant.
  if(!/^claude[-.]/i.test(m)) return null

}
function costOf(model,u,provider){ const r=priceRow(model,provider); if(!r) return null
  const [i,o,cw,cr]=r; return ((u.fresh||0)*i+(u.out||0)*o+(u.create||0)*cw+(u.read||0)*cr)/1e6 } // u = neutral canonical usage (D18a Q1)
// Render a cost cell. No price row ⇒ "n/a" + why, reusing the SAME treatment as the existing
// "usage 未返回" case (2.2:102 不冒充 $0) rather than inventing a new visual language.
const NOPRICE='no local unit price for this (provider, model) — asight does NOT guess (a fabricated figure is worse than none, 不变式4). Add a row for this model to pricing.json / ASIGHT_PRICING to price it (D14).'
const costCell=(model,u)=>{ const c=costOf(model,u); return c==null?`<b title="${NOPRICE}">n/a</b>`:`<b>${usd(c)}</b>` }
// D14 保真标:花费 = 本地估价(canonical usage × 可编辑单价),非线上账单事实。就地标 → 不变式4;可复算 → §验收#3。(usd() 见下方 demo 复用的格式化器)
const COSTTITLE='≈ 本地估价(local estimate, NOT a wire fact): Σ(canonical usage × 你的本地单价, opus/sonnet/haiku 四价 input/output/cache-write/cache-read). Provider 不在 wire 上返回金额;单价是可编辑配置(pricing.json / ASIGHT_PRICING),改价即改此估算。cost 是派生-only,绝不入归一化存储(D14 / 不变式2·4).'

function costDin(c){ const u=c.usage||{}, m=String(c.rec?.request?.model||'').replace('claude-',''), tot=(u.read||0)+(u.create||0)+(u.fresh||0)+(u.out||0)
  if(tot<=0) return `<div class="din" style="color:var(--dim)">${esc(m)} · usage 未返回 — 成本 n/a(不冒充 $0)</div>`
  return `<div class="din" style="color:var(--dim)">${esc(m)} · ${kf(u.out||0)} out tok · ≈ cost ${costCell(c.rec?.request?.model,u)} ${estBadge}</div>` }
const usd=n=>n>=1?'$'+n.toFixed(2):n>=0.01?'$'+n.toFixed(3):n>0?'$'+n.toFixed(4):'$0'

  if(/CLAUDE/i.test(label)) return meta&&meta.project_path?`${meta.project_path}/CLAUDE.md`:'CLAUDE.md'
  return label
}

function md(s){
  s = esc(s)
  const blocks=[], S0=String.fromCharCode(0xE000), S1=String.fromCharCode(0xE001)
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,lang,code)=>{blocks.push(code.replace(/\n+$/,''));return S0+(blocks.length-1)+S1})
  s = s.replace(/^(#{1,4})\s+(.+)$/gm,'<span class="mdh">$2</span>')
  s = s.replace(/\*\*([^\n*]+)\*\*/g,'<strong>$1</strong>')
  s = s.replace(/(^|[^*\w])\*([^\n*]+)\*(?!\w)/g,'$1<em>$2</em>')
  s = s.replace(/(^|[^_\w])_([^\n_]+)_(?!\w)/g,'$1<em>$2</em>')
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>')
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  s = s.replace(new RegExp(S0+'(\\d+)'+S1,'g'),(_,i)=>`<pre class="mdc">${blocks[+i]}</pre>`)
  return s
}

let A=null, raw=[], probes={count:0,series:[]}, meta=null

  if(resets.length) parts.push(`${resets.length} file(s) shrank and were re-read`)
  const pend=Object.keys((h&&h.tail_pending)||{}); if(pend.length) parts.push(`${pend.length} file(s) end in an incomplete line (a write in progress, or a writer that stopped mid-line): `+pend.slice(0,3).map(f=>`<b>${esc(f.split('/').pop())}</b>`).join(', '))

      const ic=s.entrypoint==='desktop'?'🖥':'⌨'
      return `<option value="${esc(s.project_slug)}::${esc(s.session_id)}">${ic} ${esc(label)}${s.has_subagent?' 🧬':''} — ${kinds}</option>`
    }

    if(sel.dataset.sig!==opts){ sel.innerHTML=opts; sel.dataset.sig=opts; if(curSel)sel.value=curSel }
    if(!curSel){ const p0=realP[0]||unres[0]; if(p0)curSel=`${p0.sessions[0].project_slug}::${p0.sessions[0].session_id}`; if(curSel)sel.value=curSel }
    boardEmpty=!curSel
    if(!curSel){ renderEmpty(emptyMessage()); return }
    // the control and capture-health views replace the session's timeline: coming back must fetch and render the
    // session again (and show its own errors), not short-circuit on the sigs of the render it replaced
    if(curSel==='__caphealth__'){ document.body.classList.add('ctrlmode'); controlSig=null; lastCheapSig=null; lastRenderSig=null; renderCapHealthView(); return }
    if(curSel==='__control__'){ document.body.classList.add('ctrlmode'); lastCheapSig=null; lastRenderSig=null; await renderControlView(); return }
    document.body.classList.remove('ctrlmode'); controlSig=null // leaving control view: force a full re-render next time (else a stale session header sticks)
    hideSessionChrome(false)
    const [slug,id]=curSel.split('::')
    // cheap short-circuit: the /api/projects list (already fetched above) carries each
    // session's live calls-count + last_ts. If ours is unchanged, skip the heavy
    // /api/session fetch entirely — a big session no longer re-ships every poll.
    const cur=projectsFlat.find(s=>s.project_slug===slug&&s.session_id===id)
    // BUG 1: pick the WINDOW before the fetch. /api/projects already carries this session's true
    // call count (it counts the whole session, unbounded), so the tail window is known without a
    // round-trip. On a session switch — and while live-following — the window parks on the tail:
    // that is where `follow` sits and what the user is watching. A manual scrub off the live end
    // clears `follow` (setPlayhead) so the window then stays where the user put it.
    // Prefer the total the SERVER reported for this session over the projects count: a large session
    // is tail-bounded server-side before paging, so the two can disagree, and aiming at a tail the
    // server does not have would re-aim (below) on every single poll — an oscillation that would
    // also fight live-follow. Once a page has landed, its `total` is the authority.
    { const srvTotal=(curSel===pageSig&&pageInfo&&typeof pageInfo.total==='number')?pageInfo.total:null
      const tailCur=Math.max(0,(srvTotal!=null?srvTotal:((cur&&cur.calls)||0))-PAGE_LIMIT)
      if(curSel!==pageSig){ pageSig=curSel; pageCur=tailCur; pageInfo=null; pageReaimed=false }
      else if(follow) pageCur=tailCur }
    if(cur){ const cs=curSel+'|'+cur.calls+'|'+cur.last_ts+'|'+pageCur // window is part of the sig: moving it MUST re-fetch
      if(cs===lastCheapSig){ document.getElementById('dot').classList.toggle('on',document.getElementById('liveChk').checked); return }
      lastCheapSig=cs }
    // Distinguish FAILED-to-load from genuinely-empty: a 500 (or a dead server) used to fall through
    // to raw=[] and render "No LLM calls traced yet", which LIES about a session that has calls.
    const res=await fetch(`/api/session?project=${encodeURIComponent(slug)}&id=${encodeURIComponent(id)}&cursor=${pageCur|0}&limit=${PAGE_LIMIT}`).catch(e=>({ok:false,status:0,_err:String(e&&e.message||e)}))
    const d=res.ok?await res.json().catch(e=>({error:'malformed JSON from server: '+(e&&e.message||e)})):{error:res._err||('HTTP '+res.status)}
    if(d.error){
      const eb=document.getElementById('truncbar')
      if(eb){ eb.style.cssText='margin:4px 12px 0;padding:5px 10px;border:1px solid #7a2b18;background:#2a1210;color:#f08a6a;border-radius:5px;font-size:11px;line-height:1.45'
        eb.innerHTML=`⚠ 加载失败 · could not load this session: <b>${String(d.error).replace(/[<>&]/g,'')}</b> — the raw trace on disk is intact (source truth unaffected). If the server died, restart it; if the session is huge, it is served tail-bounded.` }
      renderEmpty('Could not load this session — see the banner above.')
      document.getElementById('stats').innerHTML=''
      // R8 (audit 2026-07-19): the cheap short-circuit sig was set BEFORE this fetch, so leaving it
      // set means the next poll skips the retry and the board stays wedged even after the server
      // recovers — re-selecting the same session could not un-stick it. Clear both sigs so the very
      // next poll re-fetches. And drop the live dot: a green dot during an outage claims a freshness
      // we do not have (invariant 4).
      lastCheapSig=null; lastRenderSig=null
      document.getElementById('dot').classList.remove('on')
      return
    }
    pageInfo=d.page||null
    viewErrors={sel:curSel,list:(d.source&&d.source.errors)||[]}
    renderSourceHealth(projSource,viewErrors.list) // this session's files it could not read in full
    // BUG 1 · self-correct. The server may assemble FEWER calls than /api/projects counted (a large
    // session is tail-bounded server-side BEFORE paging is applied — see the WIRING GAP note in the
    // audit). If our window landed entirely past what it actually assembled, every call would render
    // paged_out and the board would go BLANK — strictly worse than the pre-paging behaviour of
    // showing the tail. Re-aim once at the tail the server really has.
    if(pageInfo&&pageInfo.returned===0&&pageInfo.total>0){
      const c2=Math.max(0,pageInfo.total-PAGE_LIMIT)
      // NOTE: `follow` is deliberately NOT cleared here — c2 IS the live end of what the server has,
      // so we are still following it. Clearing it would silently stop live-follow on exactly the big
      // sessions this path exists for.
      if(c2!==(pageCur|0)&&!pageReaimed){ pageReaimed=true; pageCur=c2; lastCheapSig=null; lastRenderSig=null; return poll() }
    } else pageReaimed=false
    raw=d.records||[]; probes=d.probes||{count:0,series:[]}; meta=d.meta||null
    // 保真边界: a session too large to ship whole arrives truncated to its most-recent calls.
    // The raw NDJSON on disk stays complete — mark the view non-complete (invariant 4).
    const tb=document.getElementById('truncbar'), t=d.truncated
    if(tb){ if(t){ tb.innerHTML=`⚠ 非完整视图 · showing the most recent <b>${t.shown}</b> of <b>${t.total||'?'}</b> calls (${t.kept_mb} MB of ${t.file_mb} MB) — this session is too large for the demo loader; older calls are omitted from the view but intact in the raw trace.`
      tb.style.cssText='margin:4px 12px 0;padding:5px 10px;border:1px solid #7a5b18;background:#241d0b;color:#e8c15a;border-radius:5px;font-size:11px;line-height:1.45'
    } else { tb.style.display='none'; tb.innerHTML='' } }
    // skip the whole re-analyze+render when this session's data is unchanged — otherwise the
    // 1.5s live poll rebuilds the context window and wipes any block you just expanded.
    // BUG 1: the window is part of the render sig — the slim `records` list does NOT change when the
    // cursor moves, so without this a re-aimed page would fetch and then silently skip its render.
    const sig=curSel+'|'+(pageCur|0)+'|'+raw.length+'|'+(raw.length?String(raw[raw.length-1]?.ts_request||raw[raw.length-1]?.id||''):'')
    if(sig===lastRenderSig){ document.getElementById('dot').classList.toggle('on',document.getElementById('liveChk').checked); return }
    lastRenderSig=sig
    A=d.analyzed||{lanes:[],calls:[]} // server-side analyze() output, per-call fields pre-baked
    // 3.1:58 · 不变式4 — traffic no dissector recognizes is counted and named, never drawn as something else.
    { const ub=document.getElementById('unknownbar'), u=A&&A.unknown
      if(ub){ if(u){ ub.innerHTML=`⚠ 未识别 · unrecognized traffic — <b>${u.records}</b> record${u.records===1?'':'s'}${u.partial?' in this session':''} match no dissector and are NOT rendered (${esc((u.endpoints||[]).join(', '))}). ${esc(u.reason||'')}`
          ub.style.cssText='margin:4px 12px 0;padding:5px 10px;border:1px solid #7a3b3b;background:#241010;color:#e89a9a;border-radius:5px;font-size:11px;line-height:1.45'
        } else { ub.style.display='none'; ub.innerHTML='' } } }
    lanes=buildLanes(A,probes)
    anchor=lanes.find(l=>l.kind==='main')||lanes[0]||null
    if(!anchor){ render(); return }
    anchorTs=anchor.calls.map(c=>Date.parse(c.ts))
    const before=anchor._prev||0; anchor._prev=anchor.calls.length
    const prevPh=playhead
    if(follow && anchor.calls.length>before) playhead=Math.max(0,anchor.calls.length-1)
    playhead=Math.min(playhead,Math.max(0,anchor.calls.length-1))
    if(playhead!==prevPh) openBlocks.clear() // live-follow jumped to a new call
    // D13 brush window: reset to full on session switch; on same-session live growth keep the
    // user's window but clamp it, and if they were parked at the end, extend to follow new calls.
    { const N=anchor.calls.length
      if(curSel!==viewSig){ viewSig=curSel; view={lo:0,hi:N} }
      else { if(view.hi>=(viewPrevN||N)) view.hi=N
        view.hi=Math.min(N,view.hi||N); view.lo=Math.max(0,Math.min(view.lo,N-1)); if(view.hi<=view.lo) view.hi=Math.min(N,view.lo+1) }
      viewPrevN=N }
    render()
    document.getElementById('dot').classList.toggle('on',document.getElementById('liveChk').checked)
  }catch(e){ document.getElementById('dot').classList.remove('on'); console.error(e) }
}
// BUG 2 (audit 2026-07-19): this used to clear only the panels, leaving the overview strip, the
// position indicator, the axis captions and the header stats carrying the PREVIOUS session's data
// — so a session that failed or is empty rendered under another session's waveform and a header
// like "6 turns · peak 140k". Every widget that carries per-session data MUST be neutralized here
// (不变式4 · 1.5:64 "不残留上一 session chrome"). The top bar is deliberately NOT cleared: it is
// set for the CURRENT session before render()'s !anchor early-exit.
function renderEmpty(msg){ document.body.classList.remove('ctrlmode'); brushDragging=false; /* the brush element is about to be destroyed; its up() handler is the only thing that clears this flag, and renderOverview() early-returns while it is set */ document.getElementById('ctxwin').innerHTML=`<div class="empty">${esc(msg)}</div>`; document.getElementById('ctxnav').innerHTML=''; document.getElementById('rails').innerHTML=''; document.getElementById('sawrow').innerHTML='<div id="reviewbracket"></div>'; const rx=document.getElementById('resexp'); if(rx)rx.innerHTML=''; const rp=document.getElementById('rawpanel'); if(rp)rp.innerHTML=''; const cr=document.getElementById('cacherow'); if(cr)cr.innerHTML=''
  const st=document.getElementById('stats'); if(st)st.innerHTML=''                       // header stats (turns / peak ctx / errors)
  const ov=document.getElementById('ovstrip'); if(ov)ov.innerHTML=''                     // overview waveform + brush + pin
  for(const id of ['sawmid','sawstart','sawend']){ const e=document.getElementById(id); if(e)e.textContent='' } // axis captions
  const ph=document.getElementById('phlabel'); if(ph)ph.textContent=''                   // position indicator (#n/N)
  const lh=document.getElementById('lanehint'); if(lh)lh.innerHTML=''                    // which lane / how many turns
}
function hideSessionChrome(hide){ document.getElementById('saw').style.display=hide?'none':''; document.getElementById('rails').style.display=hide?'none':'' }

// Envelope-tolerant readers (R1, audit 2026-07-19). /api/control ships RAW records: the product
// D10 envelope uses `resp`/`req_headers`/`req_body`, demo v0 used `response`/`request_headers`/
// `request`. Reading only the v0 names made every status cell render "?" (260/260 rows on a real
// capture), the feature-flags section never render, and the detail panel show UA "?" with blank
// byte counts. Mirror of respOf()/headersOf() on the server (src/view/assemble.mjs).
const rsp=r=>(r&&(r.resp||r.response))||{}
const rhdr=r=>(r&&(r.req_headers||r.request_headers))||{}
const rbytes=r=>(r&&r.request&&r.request.raw_chars)??(r&&r.req_body&&typeof r.req_body==='object'?r.req_body.raw_chars:null)??(typeof (r&&r.req_body)==='string'?r.req_body.length:null)

// ── control-plane view: the session-LESS traffic, categorized ────────────────
const CTRL_META={
  control:{ic:'🚩',what:'feature flags & experiments — the config your client is actually running'},
  account:{ic:'👤',what:'account & onboarding settings'},
  registry:{ic:'🧩',what:'MCP server registry lookups (installable + configured)'},
  telemetry:{ic:'📊',what:'usage/UI analytics batches (event bodies not on the wire capture; response = accepted count)'},
  other:{ic:'❔',what:'uncategorized session-less calls'},
}
const CTRL_ORDER=['control','account','registry','telemetry','other']
async function renderControlView(){
  hideSessionChrome(true)
  document.getElementById('dot').classList.toggle('on',document.getElementById('liveChk').checked)
  const list=await fetch('/api/control').then(r=>r.json()).catch(()=>({classes:[]}))
  viewErrors={sel:'__control__',list:(list.source&&list.source.errors)||[]}
  renderSourceHealth(projSource,viewErrors.list) // control/ files it could not read in full
  const sig=JSON.stringify(list.classes)
  const tl=document.getElementById('timeline')
  if(sig===controlSig && tl.dataset.mode==='control') return
  capHSig=null
  controlSig=sig
  const got=await Promise.all((list.classes||[]).map(c=>fetch('/api/control?class='+encodeURIComponent(c.class)).then(r=>r.json()).then(d=>({class:c.class,records:d.records||[]})).catch(()=>({class:c.class,records:[]}))))
  controlData={}; got.forEach(c=>controlData[c.class]=c.records)
  const total=got.reduce((a,c)=>a+c.records.length,0)
  document.getElementById('agentChip').textContent='⚙ control-plane'
  document.getElementById('forkChip').style.display='none'
  document.getElementById('sessTitle').textContent='control-plane'
  document.getElementById('sessMeta').textContent='session-less traffic'
  document.getElementById('stats').innerHTML=`<span><b>${total}</b> calls</span><span><b>${got.length}</b> categories</span>`
  const cls=got.slice().sort((a,b)=>(CTRL_ORDER.indexOf(a.class)+99)%99 - (CTRL_ORDER.indexOf(b.class)+99)%99)
  let html=`<div class="ctrlhdr">⚙ <b>Control-plane traffic</b> — the session-less calls agents make around your conversations (no session key from the harness table). Captured but kept out of the conversation picker. Click any call for its request + response.</div>`
  for(const c of cls){
    const m=CTRL_META[c.class]||{ic:'•',what:''}
    const recent=c.records.slice(-80).reverse()
    const rows=recent.map((r)=>{
      const gi=c.records.indexOf(r), st=rsp(r).status
      return `<div class="ctrlrow" data-cls="${esc(c.class)}" data-i="${gi}"><span class="tm">${fmtTime(r.ts_request)}</span><span class="m">${esc(r.method||'')}</span><span class="ep">${esc((r.endpoint||'').split('?')[0])}</span><span class="st ${st>=400?'err':''}">${st??'?'}</span></div>`
    }).join('')
    const more=c.records.length>80?`<div class="ctrlrow" style="cursor:default;color:var(--dimmer)">… ${c.records.length-80} older not shown</div>`:''
    html+=`<details class="ctrlsec" ${c.class==='control'?'open':''}><summary>${m.ic} <b>${esc(c.class)}</b> <span class="cc">${c.records.length}</span><span class="cwhat">${esc(m.what)}</span></summary>${rows}${more}</details>`
  }
  tl.dataset.mode='control'; tl.innerHTML=html
  document.getElementById('ledger').innerHTML=controlLedger(got,total)
  document.querySelectorAll('#timeline .ctrlrow[data-cls]').forEach(row=>row.onclick=()=>openControlDetail(row.dataset.cls,+row.dataset.i))
}
function controlLedger(got,total){
  let html=`<div class="curmeta">⚙ control-plane · ${total} session-less calls</div>`
  html+=`<div style="color:var(--dim);font-size:10px;margin-bottom:6px">Claude Code's telemetry &amp; config plumbing — never part of a conversation.</div>`
  // surface the actual feature flags observed (the genuinely interesting bit)
  const flags=new Map()
  for(const r of controlData.control||[]){ const f=rsp(r).body?.features; if(f&&typeof f==='object') for(const [k,v] of Object.entries(f)) flags.set(k, v&&typeof v==='object'?v.value:v) }
  if(flags.size){
    html+=`<h2><span class="gi" style="background:var(--pink)"></span>Feature flags observed <span class="ct">(${flags.size})</span></h2>`
    html+=[...flags].slice(0,40).map(([k,v])=>`<div class="res"><div class="top"><span class="nm" title="${esc(k)}">${esc(k)}</span><span class="via">${esc(JSON.stringify(v)).slice(0,18)}</span></div></div>`).join('')
  }
  html+=`<h2><span class="gi" style="background:var(--accent)"></span>Categories</h2>`
  for(const c of got.slice().sort((a,b)=>b.records.length-a.records.length)){
    const m=CTRL_META[c.class]||{ic:'•'}
    html+=`<div class="res"><div class="top"><span class="nm">${m.ic} ${esc(c.class)}</span><span class="via">${c.records.length}</span></div></div>`
  }
  return html
}
function openControlDetail(cls,i){
  const r=(controlData[cls]||[])[i]; if(!r)return
  const det=document.getElementById('detail'), resp=rsp(r), hdr=rhdr(r)
  const body=resp.body, bodyStr=body==null?'(empty)':(typeof body==='string'?body:JSON.stringify(body,null,2))
  det.className='open'
  det.innerHTML=`<div class="dclose" id="dclose">✕ close</div>`+
    `<h3>${esc(r.method||'')} ${esc((r.endpoint||'').split('?')[0])} · ${resp.status??'?'}</h3>`+
    `<div class="din">${fmtTime(r.ts_request)} · UA <b>${esc(hdr['user-agent']||'?')}</b> · request ${kf(rbytes(r))} bytes`+
      // 4.6 W16 read half · 4.1 保真边界: a non-LLM body (HTTP or WebSocket) is stored as its length only
      (r.req_body&&typeof r.req_body==='object'&&r.req_body.verbatim===false?` <span class="pobadge" title="non-inference request bodies are stored as their length only (4.1 保真边界)">非逐字 · length only</span>`:' (request body not decoded for non-LLM calls; the response is)')+`</div>`+
    `<div class="din" style="color:var(--dim)">response body:</div>`+
    collapse('<pre>'+esc(bodyStr)+'</pre>',bodyStr.length,'ctrl:'+cls+':'+i)
}

// ── D38 采集健康 (2.6 §C session-less group · 1.5): the ctrlmode grid over /api/capture-health — the timeline lists
// failures by reason (24 h), the ledger what holds now, each agent's last capture and last failure, the daemon, the
// last install / uninstall; a row opens its metadata in #detail. Not a session: the data is capture metadata, not
// normalized rows. Every name shown (agent, where, code) comes from the payload: no harness or provider is named here.
const NO_SESSIONS='No sessions captured yet. Start a tap with `asight monitor on` (Claude Code CLI) or `asight desktop on` (Claude Desktop, macOS + Clash Verge), then run your agent. Check what is arranged with `asight monitor status`.'
let boardEmpty=false, capHSig=null, capHRows=[]
// an empty board while capture fails or the collector is not running says so (0.1 §0 #5), never "not started yet"
function emptyMessage(){
  const s=capH&&capH.summary
  if(capH&&capH.unreadable) return `没采到会话 · no sessions — and capture health could not be read (${capH.unreadable}); see 采集健康`
  if(!s) return NO_SESSIONS
  const who=s.part==='legacy'?'旧 MITM / the old capture':'采集器 / the collector'
  if(s.state==='failing') return `没采到会话:${s.n} 个采集失败,见采集健康 · no sessions: ${s.n} capture failure(s), see 采集健康 (top bar / ⚙ session-less)`
  if(s.state==='not-running'||s.state==='not-responding') return `没采到会话:${who}${s.state==='not-running'?'没在跑':'没响应'},见采集健康 · no sessions: ${s.part==='legacy'?'the old capture':'the collector'} is ${s.state==='not-running'?'not running':'not responding'} — see 采集健康`
  return NO_SESSIONS
}
function capHealthLabel(){
  const s=capH&&capH.summary
  if(capH&&capH.unreadable) return '? 采集健康 · capture health (unreadable)'
  if(!s) return '采集健康 · capture health'
  return s.state==='failing'?`⚠ 采集健康 (${s.n}) · capture health`:'采集健康 · capture health'
}
const chRow=(i,tm,what,count,reason,cls='')=>`<div class="ctrlrow" data-ch="${i}"><span class="tm">${esc(tm)}</span><span class="m">${esc(count)}</span><span class="ep" title="${esc(reason)}">${esc(what)} — ${esc(reason)}</span><span class="st ${cls}"></span></div>`
const groupWhat=g=>g.last&&g.last.event==='failure'?`${g.last.where}/${g.last.code}`:g.key
function renderCapHealthView(){
  hideSessionChrome(true)
  document.getElementById('agentChip').textContent='⚙ 采集健康'
  document.getElementById('forkChip').style.display='none'
  document.getElementById('sessTitle').textContent='capture health · 采集健康'
  const tl=document.getElementById('timeline'), led=document.getElementById('ledger')
  if(!capH){ tl.dataset.mode='caphealth'; tl.innerHTML='<div class="ctrlhdr">reading /api/capture-health …</div>'; led.innerHTML=''; return }
  const sig=JSON.stringify({...capH,generated_at:null})
  if(sig===capHSig&&tl.dataset.mode==='caphealth') return
  capHSig=sig
  document.getElementById('sessMeta').textContent=`read from disk at ${fmtWhen(capH.generated_at)}`
  if(capH.unreadable){ tl.dataset.mode='caphealth'; tl.innerHTML=`<div class="ctrlhdr">⚠ <b>capture health could not be read</b> — ${esc(capH.unreadable)}. Nothing below can be trusted to be complete; the files on disk are untouched.</div>`; led.innerHTML=''; return }
  const c=capH.collector||{}, l=capH.legacy||{}, r=capH.raw||{}, rd=capH.read||{}
  capHRows=[]
  const row=(rec,tm,what,count,reason,cls)=>{ capHRows.push(rec); return chRow(capHRows.length-1,tm,what,count,reason,cls) }
  const sec=(title,n,body,open)=>`<details class="ctrlsec" ${open?'open':''}><summary><b>${esc(title)}</b> <span class="cc">${n}</span></summary>${body||'<div class="ctrlrow" style="cursor:default;color:var(--dimmer)">none</div>'}</details>`
  const fails=(c.failures||[]).slice().sort((a,b)=>String(b.last_ts).localeCompare(String(a.last_ts)))
  let html=`<div class="ctrlhdr">⚙ <b>采集健康 · capture health</b> — every capture failure asight recorded, read from disk (the collector's <code>flows/</code>, its lock and install manifest, the raw journal, the old capture's events). A disclosure, not an alert: failures of the last ${esc(rd.window_hours||24)} h by reason; what was not captured by design is only counted. Click a row for its metadata (never record bytes).</div>`
  if((rd.errors||[]).length) html+=`<div class="ctrlhdr" style="color:var(--amber)">⚠ 读不全 · could not read: ${rd.errors.map(e=>`<code>${esc(e.file)}</code> (${esc(e.error)})`).join(', ')} — what they hold is missing below.</div>`
  if(rd.truncated) html+=`<div class="ctrlhdr">only the most recent part of <code>flows/</code> was read (older records left out).</div>`
  html+=sec('failures · last 24 h',fails.length,fails.map(g=>row(g.last,fmtWhen(g.last_ts),groupWhat(g),'×'+g.count,(g.last&&(g.last.reason||(g.last.error&&g.last.error.message)))||'','err')).join(''),true)
  if(l.present) html+=sec('old capture (MITM / reverse proxy) · '+l.state,(l.failures||[]).length,(l.failures||[]).map(g=>row(g.last,fmtWhen(g.last_ts),groupWhat(g),'×'+g.count,(g.last&&g.last.reason)||'','err')).join(''),(l.failures||[]).length>0)
  html+=sec('raw layer (seal / verify / read)',(r.problems||[]).length,(r.problems||[]).map(p=>row(p,fmtWhen(p.ts),`${p.op} ${p.outcome}`,'',`${p.file||p.target||''} ${p.reason||''}`,'err')).join(''),(r.problems||[]).length>0)
  const exp=Object.entries(c.expected||{})
  html+=sec('not captured by design · counted',exp.reduce((n,[,k])=>n+k,0),exp.map(([k,n])=>`<div class="ctrlrow" style="cursor:default"><span class="tm"></span><span class="m">×${n}</span><span class="ep">${esc(k)}</span><span class="st"></span></div>`).join(''),false)
  tl.dataset.mode='caphealth'; tl.innerHTML=html
  document.querySelectorAll('#timeline .ctrlrow[data-ch]').forEach(el=>el.onclick=()=>openCapHealthDetail(+el.dataset.ch))
  led.innerHTML=capHealthLedger(c,l)
  document.querySelectorAll('#ledger .res[data-ch]').forEach(el=>el.onclick=()=>openCapHealthDetail(+el.dataset.ch))
