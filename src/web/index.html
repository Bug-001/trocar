  if(viewPin) return renderResourceView(el)
  const call=anchor&&anchor.calls[playhead]
  if(!call||!call.rec){ el.innerHTML='<div class="rpempty">no request captured for this step</div>'; return }
  const rq=call.rec.request||{}, u=call.usage||{} // neutral canonical usage (D18a Q1)
  const read=u.read||0, create=u.create||0, fresh=u.fresh||0, out=u.out||0
  // D14 花费:本地估价 = costOf(model, canonical usage)。无 usage(error/interrupted)→ 显 '?',MUST NOT 填 $0 冒充(2.2:102)。
  const hasU=(read+create+fresh+out)>0
  const costLine=hasU?`≈ cost <b>${usd(costOf(rq.model,u))}</b> ${estBadge}`
    :`≈ cost <b title="no usage returned for this step — not faked as $0 (不变式4)">?</b> ${estBadge}`
  el.innerHTML=`<div class="rphd">🩻 raw · call #${playhead+1}</div>`+
    `<div class="rpk">${esc(String(rq.model||'').replace('claude-',''))} · ${kf(rq.context_chars)} bytes wire</div>`+
    `<div class="rpk">msgs <b>${kf(rq.message_count)}</b> · tools <b>${kf(rq.tool_count)}</b> · system <b>${kf(rq.system_chars)}</b>c</div>`+
    `<div class="rpk">usage · read <b>${kf(read)}</b> · new-cache <b>${kf(create)}</b> · fresh <b>${kf(fresh)}</b> · out <b>${kf(out)}</b></div>`+
    `<div class="rpk rpcost">${costLine}</div>`
}
function renderContextWindow(){
  renderRawPanel()
  const win=document.getElementById('ctxwin')
  const call=anchor&&anchor.calls[playhead]
  if(!call||!call.rec){ curFlat=[]; win.innerHTML='<div class="empty">No request captured for this step (a probe or an interrupted call).</div>'; return }
  const flat=call.flat||[]; curFlat=flat // pre-baked server-side (D18a)
  const rq=call.rec.request||{}, u=call.usage||{} // neutral canonical usage (D18a Q1)
  // cache-break vs the PREVIOUS in-lane call (compute both flats on demand — light: 2 calls, not all)
  const prevCall=playhead>0?anchor.calls[playhead-1]:null
  const prevFlat=prevCall&&prevCall.rec?(prevCall.flat||null):null // pre-baked (for D17② segTax Δ below)
  const brk=call.cacheBreak||{idx:0,rawIdx:0,gt:null} // pre-baked cache-break vs prev in-lane call
  const read=u.read||0, create=u.create||0, fresh=u.fresh||0
  const totIn=read+create+fresh, hitPct=totIn?Math.round(read/totIn*100):0
  const model=String(rq.model||'').replace('claude-','')
  const counts={}; flat.forEach(b=>counts[b.sec]=(counts[b.sec]||0)+1)
  const tax=segTax(flat) // D17② schema-tax segment weights
  const prevTax=prevFlat?segTax(prevFlat):null // D17② context-growth Δ
  // 步间 diff (2.3 · D24): reference = diffRef when valid, else the previous in-lane step. added =
  // ◆new (cur key ∉ ref); removed = ref blocks absent from cur — surfaced EXPLICITLY (the gap the
  // demo's ◆new-only marking missed under compaction/rewrite). Pure key-set diff, zero byte-diff.
  const refIdx=(diffRef!=null&&diffRef>=0&&diffRef<anchor.calls.length&&diffRef!==playhead&&anchor.calls[diffRef]&&anchor.calls[diffRef].flat)?diffRef:(prevCall?playhead-1:null)
  const refFlat=refIdx!=null?(anchor.calls[refIdx].flat||null):null
  const refKeys=refFlat?new Set(refFlat.map(b=>b.key)):null // ◆new marks vs the diff reference
  const curKeys=new Set(flat.map(b=>b.key))
  const removed=refFlat?refFlat.filter(b=>!b.volatile&&!curKeys.has(b.key)):[]
  let html=`<div class="cwmeta">`+
    `<div class="cwtitle">context @ call <b>#${playhead+1}</b>/${anchor.calls.length} · ${esc(model)} · ${fmtTime(call.ts)}</div>`+
    `<div class="cwsub">the exact input to the model, in assembly order <b>tools → system → messages</b> · ${kf(flat.length)} blocks · ${kf(rq.context_chars)} bytes on the wire</div>`+
    `<div class="cwcache">⚡ KV cache this call: <b class="chit">${hitPct}%</b> reused · <b>${kf(read)}</b> tok read · <b>${kf(create)}</b> newly cached · <b>${kf(fresh)}</b> fresh${brk.firstCall?(read?' · first captured call — reuse is from a warm cross-session cache prefix (tools+system)':' · first call, nothing to reuse'):''}</div>`+
    taxSummary(tax)+growthLine(tax,prevTax,brk)+diffControl(refIdx,removed.length)+
  `</div>`+removedSection(removed,refIdx)
  const mark=i=>(!brk.firstCall && i===brk.idx && brk.idx<flat.length)?cacheMarker(brk,read,create):''
  const msgStart=flat.findIndex(b=>b.sec==='messages')
  // tools + system: flat blocks (unchanged)
  let lastSec=null
  flat.forEach((b,i)=>{
    if(msgStart>=0 && i>=msgStart) return
    if(b.sec!==lastSec){ html+=sectionHeader(b.sec,counts,tax); lastSec=b.sec }
    html+=mark(i)+ctxBlock(b,i,refKeys)
  })
  // messages: grouped into collapsible turns (user query ▸ call turn). D12: per-turn fold state is
  // memorized by turn-anchor content_hash (turnFold), NOT by turn index → survives scrub + reload.
  if(msgStart>=0){
    const turns=messageTurns(flat), lastTi=turns.length-1
    html+=sectionHeader('messages',counts,tax)+
      `<div class="cwfoldall"><button class="foldallbtn" data-foldall="open" title="expand every turn in this step">⊞ expand all</button>`+
      `<button class="foldallbtn" data-foldall="close" title="collapse every turn in this step">⊟ collapse all</button></div>`
    turns.forEach((t,ti)=>{
      const body=t.items.map(i=>mark(i)+ctxBlock(flat[i],i,refKeys)).join('')
      const ah=turnAnchorKey(flat,t), open=turnFold.has(ah)?turnFold.get(ah):(ti===lastTi)
      html+=`<div class="cwturn ${open?'':'collapsed'}" data-turn="${ti}" data-anchor="${esc(ah)}">`+
        `<div class="cwturnhd"><span class="cwturnq">${t.query?'🗣 ':'⋯ '}${esc(t.label)}${t.acts?`<span class="qk">${esc(t.acts)}</span>`:''}</span><span class="cwturnn">${t.items.length}</span></div>`+
        `<div class="cwturnbody">${body}</div></div>`
    })
  }
  win.innerHTML=html
  win.querySelectorAll('.diffbtn').forEach(b=>b.onclick=()=>{ const a=b.dataset.diff, N=anchor.calls.length, base=refIdx==null?playhead:refIdx
    if(a==='resetref') diffRef=null
    else if(a==='prevref'){ let r=base-1; if(r<0)r=0; if(r===playhead)r=Math.max(0,r-1); diffRef=r }
    else if(a==='nextref'){ let r=base+1; if(r>=N)r=N-1; if(r===playhead)r=Math.min(N-1,r+1); diffRef=(r===playhead)?null:r }
    renderContextWindow() })
  win.querySelectorAll('[data-navtoggle-rem]').forEach(h=>h.onclick=()=>{ navOpen.has('cwremoved')?navOpen.delete('cwremoved'):navOpen.add('cwremoved'); renderContextWindow() })
  win.querySelectorAll('.cbh').forEach(h=>h.onclick=()=>toggleCtxBlock(h.closest('.cblk')))
  // D12: toggle writes the turn's ANCHOR content_hash into the persistent fold map (not the turn index).
  win.querySelectorAll('.cwturnhd').forEach(h=>h.onclick=()=>{ const el=h.closest('.cwturn'), ah=el.dataset.anchor
    turnFold.set(ah, el.classList.contains('collapsed')); saveFold(); renderContextWindow() })
  win.querySelectorAll('.foldallbtn').forEach(b=>b.onclick=()=>foldAll(b.dataset.foldall==='open'))
}
// D12 全展/全折:把当前步每个 turn 的 anchor content_hash 显式写成 open/close(持久),再重渲。
function foldAll(open){ for(const t of messageTurns(curFlat)) turnFold.set(turnAnchorKey(curFlat,t), !!open); saveFold(); renderContextWindow() }
function clip(s,n){ s=String(s??''); return s.length>n?s.slice(0,n)+' …':s }
function ekey(e){ return `${e.step}:${e.type}:${(e.text||e.arg||e.source||'').length}` }
function collapse(inner,len,key,label){
  if(len<=COLLAPSE) return inner
  const open=expanded.has(key)
  const shut=label||('▼ show all '+kf(len)+' chars')
  return `<div class="collapsible ${open?'open':''}" data-k="${esc(key)}"><span class="edge" title="expand / collapse"></span><div class="cwrap">${inner}</div><div class="more" data-len="${kf(len)}"${label?` data-label="${esc(label)}"`:''}>${open?'▲ collapse':shut}</div></div>`
}

// ── nav sidebar: outline of THIS context (jump within the window) + lifecycle ACROSS the session ──
const navGroup=(key,ic,label,count,kidsHtml)=>{
  const open=navOpen.has(key)
  return `<div class="navrow head ${open?'open':''}" data-navtoggle="${esc(key)}"><span class="navic">${ic}</span><span class="navlbl">${esc(label)}</span><span class="navct">${count}</span></div>`+
    (open?`<div class="navkids">${kidsHtml}</div>`:'')
}
function humanTurns(flat){
  const out=[]
  flat.forEach((b,i)=>{
    if(b.sec!=='messages'||b.role!=='user'||b.kind!=='text')return
    const raw=(b.block&&b.block.text)||''
    const human=raw.replace(/<system-reminder>[\s\S]*?<\/system-reminder>/g,'').trim()
    if(human) out.push({label:preview(human),fi:i})
  })
  return out
}
// Group the messages section into TURNS (point 2): a turn opens at a human user-text
// message (query) and runs until the next one — carrying the assistant's call turn
// (thinking / tool_use / text) and the tool_results that answer it.
function messageTurns(flat){
  const turns=[]; let cur=null
  flat.forEach((b,i)=>{
    if(b.sec!=='messages') return
    const raw=(b.block&&b.block.text)||''
    const human=(b.role==='user'&&b.kind==='text')?raw.replace(/<system-reminder>[\s\S]*?<\/system-reminder>/g,'').trim():''
    if(human||!cur){ cur={label:human?preview(human):'(context / tool results)',query:!!human,items:[]}; turns.push(cur) }
    cur.items.push(i)
  })
  // per-turn action summary for the collapsed header (what the call turn did)
  turns.forEach(t=>{ const k=t.items.map(i=>flat[i].kind); t.acts=[k.filter(x=>x==='tool_use'||x==='server_tool_use').length&&(k.filter(x=>x==='tool_use'||x==='server_tool_use').length+' tool'),k.includes('thinking')&&'think',k.includes('tool_result')&&'result'].filter(Boolean).join(' · ') })
  return turns
}
function openTurnFor(fi){ const turns=messageTurns(curFlat), lastTi=turns.length-1; const ti=turns.findIndex(t=>t.items.includes(fi))
  if(ti>=0&&!turnIsOpen(curFlat,turns[ti],ti,lastTi)){ turnFold.set(turnAnchorKey(curFlat,turns[ti]),true); saveFold(); renderContextWindow(); return true } return false }
function renderContextNav(){
  // B split: the OUTLINE of this context stays in the board (#ctxnav); the resource
  // lifecycle ("across the session") moves to the right page (#resexp).
  const nav=document.getElementById('ctxnav'), rex=document.getElementById('resexp')
  const call=anchor&&anchor.calls[playhead]
  if(!call){ nav.innerHTML=''; if(rex)rex.innerHTML=''; return }
  const flat=curFlat.length?curFlat:(call.flat||[]) // pre-baked (D18a)
  const counts={}; flat.forEach(b=>counts[b.sec]=(counts[b.sec]||0)+1)
  const sysBlocks=flat.map((b,i)=>({b,i})).filter(x=>x.b.sec==='system')
  const u=call.usage||{}, read=u.read||0, tot=read+(u.create||0)+(u.fresh||0)
  let h=`<div class="navz">this context · #${playhead+1}</div>`
  const toolBlocks=flat.map((b,i)=>({b,i})).filter(x=>x.b.sec==='tools')
  const toolKids=toolBlocks.map(x=>`<div class="navsub" data-jumpfi="${x.i}"><span class="nsl">${x.b.mcp?'🔌':'⚙'} ${esc(x.b.name)}</span></div>`).join('')||'<div class="navsub" style="opacity:.5">no tools in view</div>'
  h+=navGroup('tools','⚙','tools',counts.tools||0,toolKids)
  const sysKids=sysBlocks.map(x=>`<div class="navsub" data-jumpfi="${x.i}"><span class="nsl">${esc(x.b.label)}</span>${x.b.cc?'<span class="cc" title="cache breakpoint">⟐</span>':''}${x.b.volatile?'<span class="vol" title="per-call nonce">↻</span>':''}<span class="nsx">${kf(x.b.chars)}c</span></div>`).join('')
  h+=navGroup('sys','▤','system',counts.system||0,sysKids)
  const turns=humanTurns(flat)
  const turnKids=turns.length?turns.map(t=>`<div class="navsub" data-jumpfi="${t.fi}"><span class="nsl">🗣 ${esc(t.label)}</span></div>`).join(''):'<div class="navsub" style="opacity:.5">no plain-text user turns in view</div>'
  h+=navGroup('msg','💬','messages',counts.messages||0,turnKids)
  h+=`<div class="navrow" data-jump="cachebrk"><span class="navic">⚡</span><span class="navlbl">cache break</span><span class="navct">${tot?Math.round(read/tot*100):0}%</span></div>`
  nav.innerHTML=h
  if(rex) rex.innerHTML=`<div class="resz">resources · across the session</div>`+lifecycleNav()
  // wire jump/toggle handlers on BOTH containers (outline + resource explorer)
  ;[nav,rex].filter(Boolean).forEach(root=>{
    root.querySelectorAll('[data-navtoggle]').forEach(e=>e.onclick=()=>{ const k=e.dataset.navtoggle; navOpen.has(k)?navOpen.delete(k):navOpen.add(k); renderContextNav() })
    root.querySelectorAll('[data-jump]').forEach(e=>e.onclick=()=>jumpToAnchor(e.dataset.jump))
    root.querySelectorAll('[data-jumpfi]').forEach(e=>e.onclick=()=>jumpToBlockIndex(+e.dataset.jumpfi))
    root.querySelectorAll('[data-view]').forEach(e=>e.onclick=ev=>{ ev.stopPropagation(); viewResource(+e.dataset.viewstep,e.dataset.view,e.dataset.viewlabel) })
    root.querySelectorAll('[data-navstep]').forEach(e=>e.onclick=()=>jumpToStepAndBlock(+e.dataset.navstep,e.dataset.navres||''))
    root.querySelectorAll('[data-navmore]').forEach(e=>e.onclick=()=>{ navSeenExpanded=!navSeenExpanded; renderContextNav() })
  })
}
// lifecycle lists — the evict/inj history, reused from the resource ledger data (across steps).
function lifecycleNav(){
  const N=Math.max(1,anchor.calls.length)
  const L=gi=>{ const v=anchor.giLocal.get(gi); return v==null?N:v }
  const res=anchor.resources||[], seen=anchor.seenFiles||[]
  const files=res.filter(r=>r.kind==='file'), loaded=res.filter(r=>r.kind==='scaffold')
  const skills=res.filter(r=>r.kind==='skill')
  const caps=res.filter(r=>r.kind==='capability'), dl=[...res.filter(r=>r.kind==='dir'),...res.filter(r=>r.kind==='link')]
  let h=''
  if(files.length){
    const kids=files.map(r=>{
      const enter=L(r.segments[0].enter), lastSeg=r.segments[r.segments.length-1]
      const live=r.segments.some(s=>{const e=L(s.enter),ev=s.evict==null?N:L(s.evict);return e<=playhead&&ev>playhead})
      const notYet=enter>playhead, evAt=lastSeg.evict==null?null:L(lastSeg.evict)
      const state=notYet?'pend':(!live&&!notYet?'dead':'')
      const life=live?'<span class="en">live</span>':(evAt!=null?`<span class="ev">✂#${evAt+1}</span>`:'')
      const vd=`data-view="file::${esc(r.label)}" data-viewstep="${enter}" data-viewlabel="${esc(r.label)}"`
      return `<div class="navsub ${state}" data-navstep="${enter}" data-navres="file::${esc(r.label)}"><span class="nsl viewname" ${vd}>${esc(relPath(r.label))}</span><span class="viewbtn" ${vd} title="show file content in the panel">👁</span>${life}<span class="nsx">#${enter+1}</span></div>`
    }).join('')
    h+=navGroup('life-file','📂','files opened',files.length,kids)
  }
  if(seen.length){
    const CAP=40, show=navSeenExpanded?seen:seen.slice(0,CAP)
    const chips=show.map(s=>{ const fl=L(s.firstStep); return `<span class="navchip ${fl>playhead?'future':''}" data-navstep="${fl}" title="${esc(s.path)} · seen ${s.count}× · first @#${fl+1}">${esc(relPath(s.path))}</span>` }).join('')
    const more=seen.length>CAP?`<div class="navmore" data-navmore="1">${navSeenExpanded?'▲ fewer':'▼ all '+seen.length}</div>`:''
    h+=navGroup('life-seen','👁','only seen (names)',seen.length,`<div class="navseen">${chips}</div>${more}`)
  }
  if(loaded.length){
    // loaded context (auto-loaded scaffold) resolves to a VERBATIM system-reminder block → give it
    // the same files-style preview affordance (name/👁 → viewResource, card body → locate).
    const kids=loaded.map(r=>{ const enter=L(r.segments[0].enter)
      const vd=`data-view="scaffold::${esc(r.label)}" data-viewstep="${enter}" data-viewlabel="${esc(r.label)}"`
      return `<div class="navsub" data-navstep="${enter}" data-navres="scaffold::${esc(r.label)}"><span class="nsl viewname" ${vd} title="auto-loaded into context — 👁 shows the verbatim block">🧠 ${esc(r.label)}</span><span class="viewbtn" ${vd} title="show the verbatim loaded content in the panel">👁</span><span class="nsx">#${enter+1}</span></div>` }).join('')
    h+=navGroup('life-load','🧠','loaded context',loaded.length,kids)
  }
  if(skills.length||caps.length){
    // 🧩 capabilities — spec 2.4 §19/§33 keep skill + MCP in ONE display group (six-group
    // projection; schema keeps the fine kind, D8). Skills are the one capability whose full
    // instructions are actually RESIDENT + viewable (verbatim SKILL.md body on the wire) → a
    // richer card: enter step + segment residency + resident size + 👁 that reveals the verbatim
    // body (never a fabricated schema). MCP/other caps stay metadata chips (schema not verbatim, §58).
    const skKids=skills.map(r=>{
      const enter=L(r.segments[0].enter), lastSeg=r.segments[r.segments.length-1]
      const live=r.segments.some(s=>{const e=L(s.enter),ev=s.evict==null?N:L(s.evict);return e<=playhead&&ev>playhead})
      const notYet=enter>playhead, evAt=lastSeg.evict==null?null:L(lastSeg.evict)
      const state=notYet?'pend':(!live&&!notYet?'dead':'')
      const life=live?'<span class="en">resident</span>':(evAt!=null?`<span class="ev">✂#${evAt+1}</span>`:'')
      const size=r.loads.length?r.loads[r.loads.length-1].range:''
      const vd=`data-view="skill::${esc(r.label)}" data-viewstep="${enter}" data-viewlabel="${esc(r.label)}"`
      // size present ⇒ the verbatim body was captured; absent ⇒ only the Skill invocation was seen (labelled honestly)
      return `<div class="navsub ${state}" data-navstep="${enter}" data-navres="skill::${esc(r.label)}"><span class="nsl viewname" ${vd} title="skill (asight inference from the wire) — 👁 shows the verbatim SKILL.md body">🧩 skill: ${esc(r.label)}</span>`+
        (size?`<span class="viewbtn" ${vd} title="show the verbatim SKILL.md body in the panel">👁</span>`:'')+
        `${life}${size?`<span class="nsx" title="resident instructions size — verbatim body on the wire">${esc(size)}</span>`:`<span class="nsx" title="invocation seen; resident body not in the captured window">invocation only</span>`}<span class="nsx">#${enter+1}</span></div>`
    }).join('')
    // unify the caps' name click with files: name/👁 → viewResource (raw preview), card body → locate.
    // MCP resolves to its tool block (metadata, honestly noted in the panel); image/document have no
    // verbatim text block → viewResource falls back to the honest "click the card to locate" message.
    const capKids=caps.map(r=>{ const enter=L(r.segments[0].enter)
      // map the ledger label back to the block's resKey so the reveal can find it (MCP: → mcp::)
      const mm=/^MCP:\s*(.+)$/.exec(r.label), rk=mm?'mcp::'+mm[1]:''
      const vd=`data-view="${esc(rk)}" data-viewstep="${enter}" data-viewlabel="${esc(r.label)}"`
      return `<div class="navsub" data-navstep="${enter}"${rk?` data-navres="${esc(rk)}"`:''}><span class="nsl viewname" ${vd} title="capability — 👁 shows what's on the wire (MCP: tool metadata; image/document: located on the timeline)">🧩 ${esc(r.label)}</span><span class="viewbtn" ${vd} title="show in the panel">👁</span><span class="nsx">#${enter+1}</span></div>` }).join('')
    h+=navGroup('life-cap','🧩','capabilities',skills.length+caps.length,skKids+capKids)
  }
  if(dl.length){
    const kids=dl.map(r=>{ const enter=L(r.segments[0].enter), ic=r.kind==='dir'?'📁':'🔗'; return `<div class="navsub" data-navstep="${enter}"><span class="nsl">${ic} ${esc(relPath(r.label))}</span><span class="nsx">#${enter+1}</span></div>` }).join('')
    h+=navGroup('life-dl','🔗','dirs & links',dl.length,kids)
  }
  const comps=(anchor.events||[]).filter(e=>e.type==='compaction'||e.type==='summarize')
  if(comps.length){
    const kids=comps.map(e=>{ const at=L(e.step), lbl=e.type==='compaction'?`✂ compaction ${e.from}→${e.to} msgs`:`🗜 summary (${kf(e.out)} tok out)`; return `<div class="navsub" data-navstep="${at}"><span class="nsl">${lbl}</span><span class="nsx">#${at+1}</span></div>` }).join('')
    h+=navGroup('life-comp','✂','context resets',comps.length,kids)
  }
  return h||'<div class="navsub" style="opacity:.5">no resources tracked yet</div>'
}
// ── jump helpers: within the window (block anchors) and across the session (playhead) ──
function jumpToAnchor(id){
  const el=document.getElementById(id); if(!el)return
  el.scrollIntoView({block:'start',behavior:'smooth'}); el.classList.add('hl'); setTimeout(()=>el&&el.classList.remove('hl'),1600)
}
function jumpToBlockIndex(fi){
  openTurnFor(fi) // if the block lives in a collapsed turn, open it first
  const el=document.querySelector(`#ctxwin .cblk[data-bi="${fi}"]`); if(!el)return
  if(el.classList.contains('collapsed')) toggleCtxBlock(el)
  el.scrollIntoView({block:'center',behavior:'smooth'}); el.classList.add('hl'); setTimeout(()=>el&&el.classList.remove('hl'),2000)
}
function jumpToStepAndBlock(step,resKey){
  setPlayhead(step,true)
  if(resKey){ const el=document.querySelector(`#ctxwin .cblk[data-rk="${cssq(resKey)}"]`); if(el){ if(el.classList.contains('collapsed'))toggleCtxBlock(el); el.scrollIntoView({block:'center',behavior:'smooth'}); el.classList.add('hl'); setTimeout(()=>el&&el.classList.remove('hl'),2000) } }
}

// render a message content-block's body text (reused by the context window's lazy bodies)
function rawContentText(b){
  if(typeof b==='string') return b
  if(b.type==='text') return b.text||''
  if(b.type==='tool_use'||b.type==='server_tool_use') return `${b.name}(\n${JSON.stringify(b.input,null,2)}\n)`
  if(b.type==='tool_result'){ const c=b.content; return (typeof c==='string'?c:Array.isArray(c)?c.map(x=>x.text||`[${x.type}]`).join('\n'):JSON.stringify(c))+(b.is_error?'  ⟨is_error⟩':'') }
  if(b.type==='image') return `[image ${b.source?.media_type||b.source?.type||''}]`
  if(b.type==='document') return `[document ${b.source?.media_type||b.source?.type||b.title||''}]`
  if(b.type==='thinking') return b.thinking||''
  if(b.type==='redacted_thinking') return '[redacted_thinking]'
  return JSON.stringify(b,null,2)
}

// ── navigation ──────────────────────────────────────────────────────────────
function nearestByTs(lane,ts){
  if(!lane.calls.length)return 0
  const t=Date.parse(ts); if(isNaN(t))return Math.min(playhead,lane.calls.length-1)
  let best=0,bd=Infinity
  lane.calls.forEach((c,i)=>{ const d=Math.abs(Date.parse(c.ts)-t); if(d<bd){bd=d;best=i} })
  return best
}
function setPlayhead(i,manual){
  if(!anchor)return
  viewPin=null // scrubbing returns the panel to the call raw
  const np=Math.max(0,Math.min(anchor.calls.length-1,i))
  if(np!==playhead) openBlocks.clear() // a different call → its blocks start collapsed
  playhead=np
  if(manual) follow=(playhead===anchor.calls.length-1)
  // D13: keep the scrub target inside the brush window (pan, preserve width) — 1.4 follow
  if(playhead<view.lo||playhead>=view.hi){
    const w=Math.max(1,view.hi-view.lo), N=anchor.calls.length
    const lo=Math.min(Math.max(0,playhead-((w/2)|0)),Math.max(0,N-w))
    view.lo=lo; view.hi=Math.min(N,lo+w)
  }
  renderSaw(); renderRails(); renderContextWindow(); renderContextNav(); repositionBrush()
  if(selTick){ const l=lanes.find(x=>x.id===selTick.laneId); if(l&&(l.kind==='monitor'||l.kind==='probe'))highlightRange(l,selTick.i) }
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeDetail(); return }
  if(!anchor)return
  if(e.key==='ArrowLeft'){setPlayhead(playhead-1,true);e.preventDefault()}
  else if(e.key==='ArrowRight'){setPlayhead(playhead+1,true);e.preventDefault()}
  else if(e.key==='Home'){setPlayhead(0,true);e.preventDefault()}
  else if(e.key==='End'){setPlayhead(anchor.calls.length-1,true);e.preventDefault()}
})
document.getElementById('prev').onclick=()=>setPlayhead(playhead-1,true)
document.getElementById('next').onclick=()=>setPlayhead(playhead+1,true)
document.getElementById('endBtn').onclick=()=>{follow=true;setPlayhead(anchor.calls.length-1,true)}
document.addEventListener('click',ev=>{
  if(ev.target.closest('#dclose')){ closeDetail(); return }
  const cr=ev.target.closest('.callref')
  if(cr){ const k=+cr.dataset.call; if(k>=1){ setPlayhead(k-1,true); jumpToAnchor('cachebrk') } return }
  const t=ev.target.closest('.collapsible > .edge, .collapsible > .more')
  if(!t) return
  const c=t.parentElement, k=c.dataset.k, nowOpen=!c.classList.contains('open')
  if(nowOpen) expanded.add(k); else expanded.delete(k)
  c.classList.toggle('open',nowOpen)
  const more=c.querySelector(':scope > .more')
  if(more) more.textContent=nowOpen?'▲ collapse':(more.dataset.label||('▼ show all '+more.dataset.len+' chars'))
  ev.preventDefault()
})
document.getElementById('fileSel').onchange=()=>{curSel=document.getElementById('fileSel').value;playhead=0;follow=true;selTick=null;closeDetail();poll()}
document.getElementById('liveChk').onchange=e=>{if(e.target.checked){follow=true;poll()}}

// ── draggable board boundary: #ctxwin (center) ↔ #rightpage (right) ──────────────
// Spec 1.2 §39-40/§77/§83: the #divider affordance is rendered but drag was never wired.
// Drive #rightpage width from a root custom prop (never inline — inline would beat the
// @media narrow-stack rule), with min/max clamp + per-boundary localStorage persistence
// (dbl-click = reset). Defensive by construction so the headless render gate (DOM shim
// with no-op addEventListener, no documentElement, no localStorage) imports without throwing.
;(function(){
  try{
    const KEY='atrace.split.rightpage', DEF=320, MIN=220
    const divider=document.getElementById('divider'), pages=document.getElementById('pages'), rightpage=document.getElementById('rightpage')
    const root=document.documentElement
    let curW=DEF
    const setW=w=>{ curW=w; if(root&&root.style&&root.style.setProperty) root.style.setProperty('--rightpage-w',w+'px') }
    const lsGet=k=>{ try{ return (typeof localStorage!=='undefined')?localStorage.getItem(k):null }catch{ return null } }
    const lsSet=(k,v)=>{ try{ if(typeof localStorage!=='undefined') localStorage.setItem(k,v) }catch{} }
    const lsDel=k=>{ try{ if(typeof localStorage!=='undefined') localStorage.removeItem(k) }catch{} }
    const clampW=w=>{
      let max=720
      try{ const pr=pages&&pages.getBoundingClientRect&&pages.getBoundingClientRect(); if(pr&&pr.width) max=Math.min(720,pr.width-380) }catch{}
      if(!(max>MIN)) max=MIN
      return Math.max(MIN,Math.min(max, (isFinite(w)?w:DEF)))
    }
    // restore persisted width (runs at import — must not throw under the shim)
    const saved=parseFloat(lsGet(KEY))
    if(saved>0) setW(clampW(saved))
    if(!divider||!pages||!rightpage) return
    let dragging=false
    divider.addEventListener('pointerdown',e=>{
      dragging=true
      try{ divider.setPointerCapture&&divider.setPointerCapture(e.pointerId) }catch{}
      if(document.body&&document.body.classList) document.body.classList.add('resizing')
      if(e&&e.preventDefault) e.preventDefault()
    })
    divider.addEventListener('pointermove',e=>{
      if(!dragging) return
      const pr=pages.getBoundingClientRect()
      setW(clampW(pr.right - e.clientX))
    })
    const end=()=>{
      if(!dragging) return
      dragging=false
      if(document.body&&document.body.classList) document.body.classList.remove('resizing')
      lsSet(KEY,String(Math.round(curW)))
    }
    divider.addEventListener('pointerup',end)
    divider.addEventListener('pointercancel',end)
    divider.addEventListener('dblclick',()=>{ setW(DEF); lsDel(KEY) }) // reset affordance (spec §83)
  }catch(e){ /* never let layout wiring break the app / the render gate */ }
})()

// ── draggable board boundary #2: #ctxnav (outline) ↔ #ctxwin (center) ────────────
// Q1 / spec 1.2 §maindiv: a second gutter inside <main>. Independent of #divider — its own
// CSS var (--outline-w) + its own localStorage key. Same defensive construction as above so
// the headless render gate imports without throwing.
;(function(){
  try{
    const KEY='atrace.split.outline', DEF=270, MIN=160
    const md=document.getElementById('maindiv'), main=document.querySelector('main')
    const root=document.documentElement
    let curW=DEF
    const setW=w=>{ curW=w; if(root&&root.style&&root.style.setProperty) root.style.setProperty('--outline-w',w+'px') }
    const lsGet=k=>{ try{ return (typeof localStorage!=='undefined')?localStorage.getItem(k):null }catch{ return null } }
    const lsSet=(k,v)=>{ try{ if(typeof localStorage!=='undefined') localStorage.setItem(k,v) }catch{} }
    const lsDel=k=>{ try{ if(typeof localStorage!=='undefined') localStorage.removeItem(k) }catch{} }
    const clampW=w=>{
      let max=560
      try{ const mr=main&&main.getBoundingClientRect&&main.getBoundingClientRect(); if(mr&&mr.width) max=Math.min(560,mr.width-360) }catch{}
      if(!(max>MIN)) max=MIN
      return Math.max(MIN,Math.min(max,(isFinite(w)?w:DEF)))
    }
    const saved=parseFloat(lsGet(KEY))
    if(saved>0) setW(clampW(saved))
    if(!md||!main) return
    let dragging=false
    md.addEventListener('pointerdown',e=>{
      dragging=true
      try{ md.setPointerCapture&&md.setPointerCapture(e.pointerId) }catch{}
      if(document.body&&document.body.classList) document.body.classList.add('resizing')
      if(e&&e.preventDefault) e.preventDefault()
    })
    md.addEventListener('pointermove',e=>{
      if(!dragging) return
      const mr=main.getBoundingClientRect()
      setW(clampW(e.clientX - mr.left))
    })
    const end=()=>{
      if(!dragging) return
      dragging=false
      if(document.body&&document.body.classList) document.body.classList.remove('resizing')
      lsSet(KEY,String(Math.round(curW)))
    }
    md.addEventListener('pointerup',end)
    md.addEventListener('pointercancel',end)
    md.addEventListener('dblclick',()=>{ setW(DEF); lsDel(KEY) })
  }catch(e){ /* never let layout wiring break the app / the render gate */ }
})()

// D14: pull the editable unit-price config once (falls back to the hardcoded defaults on failure)
;(async()=>{ try{ const d=await fetch('/api/pricing').then(r=>r.json()); if(d&&d.pricing&&typeof d.pricing==='object') PRICING=d.pricing }catch{} })()
poll()
setInterval(()=>{if(document.getElementById('liveChk').checked)poll()},1500)

// auto-reload when the dashboard's own code (index.html) is redeployed, so you never sit on a
// stale tab after a deploy. (analyze now runs server-side — the browser has no analyze.mjs asset.)
let assetSig=null
async function checkAssets(){
  try{
    const a=await fetch('/index.html',{cache:'no-store'}).then(r=>r.text())
    const sig=String(a.length)
    if(assetSig!==null && sig!==assetSig){ location.reload() }
    assetSig=sig
  }catch{}
}
setInterval(checkAssets,4000)
</script>
