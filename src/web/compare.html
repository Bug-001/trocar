<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>asight — compare runs (D17③)</title>
<style>
  :root{
    --bg:#0e0f13;--panel:#16181f;--panel2:#1c1f28;--rail:#12141a;
    --fg:#e6e8ee;--dim:#9096a6;--dimmer:#5b6070;--border:#262a35;
    --accent:#7aa2f7;--green:#9ece6a;--amber:#e0af68;--cyan:#7dcfff;--purple:#bb9af7;--pink:#f7768e;--red:#f7768e;
    --a:#7aa2f7;--b:#e0af68; /* the two run colors */
    --sans:ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light){:root{
    --bg:#eef0f4;--panel:#fff;--panel2:#f3f5f9;--rail:#f7f8fb;--fg:#1a1d26;--dim:#5c6270;--dimmer:#99a0af;--border:#dde1ea;
    --accent:#3b5bdb;--green:#2f9e44;--amber:#b47407;--cyan:#0c8599;--purple:#6f42c1;--pink:#d6336c;--red:#e03131;--a:#3b5bdb;--b:#b47407;
  }}
  :root[data-theme="dark"]{--bg:#0e0f13;--panel:#16181f;--panel2:#1c1f28;--rail:#12141a;--fg:#e6e8ee;--dim:#9096a6;--dimmer:#5b6070;--border:#262a35;--accent:#7aa2f7;--green:#9ece6a;--amber:#e0af68;--cyan:#7dcfff;--purple:#bb9af7;--pink:#f7768e;--red:#f7768e;--a:#7aa2f7;--b:#e0af68;}
  :root[data-theme="light"]{--bg:#eef0f4;--panel:#fff;--panel2:#f3f5f9;--rail:#f7f8fb;--fg:#1a1d26;--dim:#5c6270;--dimmer:#99a0af;--border:#dde1ea;--accent:#3b5bdb;--green:#2f9e44;--amber:#b47407;--cyan:#0c8599;--purple:#6f42c1;--pink:#d6336c;--red:#e03131;--a:#3b5bdb;--b:#b47407;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.5;min-height:100vh;}
  .mono{font-family:var(--mono);} .tnum{font-variant-numeric:tabular-nums;}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap;}
  h1{font-family:var(--mono);font-size:16px;margin:0;letter-spacing:.5px;font-weight:600;} h1 b{color:var(--accent);}
  a.nav{color:var(--dim);font-size:11px;text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;}
  a.nav:hover{color:var(--fg);}
  .spacer{flex:1;}
  main{padding:16px 18px;max-width:1100px;margin:0 auto;}
  .pick{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .pick .lane{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:10px 12px;}
  .pick .lane.A{border-top:3px solid var(--a);} .pick .lane.B{border-top:3px solid var(--b);}
  .pick label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);}
  .pick .A label{color:var(--a);} .pick .B label{color:var(--b);}
  select{width:100%;margin-top:5px;font:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-family:var(--mono);font-size:11px;}

  h2{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin:20px 0 9px;border-bottom:1px solid var(--border);padding-bottom:5px;}
  table.stats{width:100%;border-collapse:collapse;font-family:var(--mono);}
  table.stats td,table.stats th{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border);font-size:12px;}
  table.stats th{color:var(--dim);text-transform:uppercase;font-size:9px;letter-spacing:1px;font-weight:400;}
  table.stats td:first-child,table.stats th:first-child{text-align:left;color:var(--dim);}
  table.stats .va{color:var(--a);} table.stats .vb{color:var(--b);}
  table.stats .d.up{color:var(--green);} table.stats .d.down{color:var(--red);} table.stats .d.same{color:var(--dimmer);}

  .saws{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .sawbox{background:var(--rail);border:1px solid var(--border);border-radius:9px;padding:8px 10px;}
  .sawbox .cap{font-family:var(--mono);font-size:10px;color:var(--dim);margin-bottom:5px;}
  .sawrow{display:flex;align-items:flex-end;gap:1px;height:64px;}
  .bar{flex:1 1 0;min-width:2px;border-radius:2px 2px 0 0;opacity:.72;position:relative;}
  .bar.compact::after{content:"✂";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--red);}

  /* D17③ stepwise structural diff strip — one cell per compared step */
  .align{background:var(--rail);border:1px solid var(--border);border-radius:9px;padding:10px 12px;}
  .alignhd{font-family:var(--mono);font-size:11.5px;margin-bottom:8px;}
  .alignhd b.k{color:var(--amber);}
  .stepstrip{display:flex;gap:1px;height:26px;align-items:stretch;}
  .stepcell{flex:1 1 0;min-width:3px;border-radius:2px;cursor:help;}
  .stepcell.same{background:color-mix(in srgb,var(--green) 55%,transparent);}
  .stepcell.diff{background:color-mix(in srgb,var(--red) 70%,transparent);}
  .stepcell.first{outline:2px solid var(--amber);outline-offset:-1px;}
  .steptail{display:flex;gap:1px;height:26px;margin-left:6px;}
  .steptail .x{flex:0 0 5px;border-radius:2px;}
  .steptail .xa{background:color-mix(in srgb,var(--a) 60%,transparent);} .steptail .xb{background:color-mix(in srgb,var(--b) 60%,transparent);}

  .resdiff{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .rescol{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:10px 12px;}
  .rescol h3{font-family:var(--mono);font-size:11px;margin:0 0 8px;font-weight:600;}
  .rescol.both h3{color:var(--green);} .rescol.aonly h3{color:var(--a);} .rescol.bonly h3{color:var(--b);}
  .ritem{font-family:var(--mono);font-size:11px;padding:3px 0;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:baseline;}
  .ritem .k{font-size:8px;text-transform:uppercase;letter-spacing:.5px;padding:0 4px;border-radius:6px;border:1px solid var(--border);color:var(--dim);}
  .ritem.file .nm{color:var(--fg);} .ritem.scaffold .nm{color:var(--purple);} .ritem.dir .nm{color:var(--amber);} .ritem.link .nm{color:var(--cyan);}
  .ritem .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .empty{color:var(--dimmer);padding:16px;text-align:center;font-size:11px;}
  .note{color:var(--dim);font-size:11px;margin:6px 0 0;}
  .swatch{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:middle;margin-right:4px;}
</style>
</head>
<body>
<header>
  <h1><b>a</b>sight · compare runs</h1>
  <a class="nav" href="/">← board</a>
  <div class="spacer"></div>
  <span class="note"><span class="swatch" style="background:var(--a)"></span>run A &nbsp; <span class="swatch" style="background:var(--b)"></span>run B</span>
</header>
<main>
  <div class="pick">
    <div class="lane A"><label>run A</label><select id="selA"></select></div>
    <div class="lane B"><label>run B</label><select id="selB"></select></div>
  </div>
  <div id="out"><div class="empty">Pick two runs to compare.</div></div>
</main>

<script type="module">
// D17③ 跨-run 逐步结构 diff. All analysis is SERVER-SIDE (/api/compare) → this page does ZERO provider
// parsing (invariant 3 / AC-3): it renders the canonical the server bakes. Reuses the demo compare look.
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const kf=n=>n==null?'?':n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':''+n
const base=p=>String(p||'').replace(/\/+$/,'').split('/').pop()||p
const cache=new Map()

function sessionLabel(s){
  const who=s.title||base(s.project_path||'')||(s.project_slug!=='_unresolved'?s.project_slug:'')||''
  return `${who?who+' · ':''}${String(s.session_id).slice(0,8)} · ${s.calls} calls`
}
async function compare(a,b){
  if(!a||!b) return null
  const key=a+'|'+b; if(cache.has(key)) return cache.get(key)
  const r=await fetch(`/api/compare?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`)
  if(!r.ok) return { error:r.status===404?'one or both runs not found':('server '+r.status) }
  const d=await r.json(); cache.set(key,d); return d
}

function statsTable(A,B){
  const rows=[['calls','calls'],['subagents','subagents'],['compactions','compactions'],['peak ctx','peakCtx'],['input tok','totalIn'],['output tok','totalOut']]
  const delta=(a,b)=>{const d=(b||0)-(a||0);const cls=d>0?'up':d<0?'down':'same';const s=d>0?'+'+kf(d):d<0?'−'+kf(-d):'0';return `<td class="d ${cls}">${s}</td>`}
  let h=`<table class="stats"><tr><th>metric</th><th>A</th><th>B</th><th>B−A</th></tr>`
  for(const [label,k] of rows) h+=`<tr><td>${label}</td><td class="va">${kf(A.stats[k])}</td><td class="vb">${kf(B.stats[k])}</td>${delta(A.stats[k],B.stats[k])}</tr>`
  return h+'</table>'
}
function saws(A,B){
  const peak=Math.max(1,A.stats.peakCtx||0,B.stats.peakCtx||0)
  const saw=(X,color,cap)=>{
    const bars=(X.steps||[]).map((s,i)=>`<div class="bar ${s.compaction?'compact':''}" style="height:${Math.max(3,Math.round((s.ctx||0)/peak*60))}px;background:${color}" title="call #${i+1} · ctx ${kf(s.ctx)}"></div>`).join('')
    return `<div class="sawbox"><div class="cap">${esc(cap)} · ${(X.steps||[]).length} calls · peak ${kf(X.stats.peakCtx)} · ✂${X.stats.compactions}</div><div class="sawrow">${bars}</div></div>`
  }
  return `<div class="saws">${saw(A,'var(--a)','run A')}${saw(B,'var(--b)','run B')}</div>`
}
// the marquee D17③ view: how far the two runs stayed byte-structurally identical, and where they split.
function alignView(al){
  const fd=al.firstDiverge
  const headline = al.compared===0 ? 'nothing to align (a run has no steps)'
    : fd<0 && al.aExtra===0 && al.bExtra===0 ? `<b class="k">identical structure</b> across all ${al.compared} steps`
    : fd<0 ? `identical for all ${al.compared} compared steps; run lengths differ (${al.aExtra?`A +${al.aExtra}`:''}${al.aExtra&&al.bExtra?' · ':''}${al.bExtra?`B +${al.bExtra}`:''})`
    : `stayed structurally identical for <b class="k">${al.sharedPrefix}</b> step(s), then <b class="k">first diverged at step #${fd+1}</b>`
  const cells=(al.per||[]).map(s=>{
    const cls=s.identical?'same':'diff'
    const first=(s.i===fd)?' first':''
    const t=`step #${s.i+1} · ${s.identical?'identical':`Δ +${s.added} / −${s.removed} blocks (A ${s.aBlocks} · B ${s.bBlocks})`}`
    return `<div class="stepcell ${cls}${first}" title="${esc(t)}"></div>`
  }).join('')
  const tail=`${'<div class="x xa"></div>'.repeat(Math.min(al.aExtra,40))}${'<div class="x xb"></div>'.repeat(Math.min(al.bExtra,40))}`
  return `<div class="align"><div class="alignhd">${headline}</div><div style="display:flex;align-items:center">`+
    `<div class="stepstrip" style="flex:1">${cells||'<div class="empty">—</div>'}</div>`+
    (tail?`<div class="steptail">${tail}</div>`:'')+`</div>`+
    `<p class="note">Deterministic offline byte-level comparison of the two runs' per-step context (content_hash sequence, the same primitive as the cache-break prefix) — never re-calls the model. 🟩 identical step · 🟥 structural Δ · amber outline = first divergence · A/B tail = steps only one run has.</p></div>`
}
function resDiff(R){
  const kindRank={scaffold:0,file:1,dir:2,link:3}
  const sortR=arr=>[...arr].sort((x,y)=>((kindRank[x.kind]??9)-(kindRank[y.kind]??9))||String(x.label).localeCompare(String(y.label)))
  const item=r=>`<div class="ritem ${esc(r.kind)}"><span class="k">${esc(r.kind)}</span><span class="nm">${r.kind==='file'||r.kind==='dir'?esc(base(r.label)):esc(r.label)}</span></div>`
  const col=(cls,title,arr)=>`<div class="rescol ${cls}"><h3>${title} (${arr.length})</h3>${arr.length?sortR(arr).map(item).join(''):'<div class="empty">—</div>'}</div>`
  return `<div class="resdiff">${col('both','loaded in both',R.both)}${col('aonly','A only',R.aonly)}${col('bonly','B only',R.bonly)}</div>`
}
async function render(){
  const a=document.getElementById('selA').value, b=document.getElementById('selB').value
  const out=document.getElementById('out')
  const d=await compare(a,b)
  if(!d){ out.innerHTML='<div class="empty">Pick two runs to compare.</div>'; return }
  if(d.error){ out.innerHTML=`<div class="empty">${esc(d.error)}</div>`; return }
  out.innerHTML =
    `<h2>at a glance</h2>${statsTable(d.a,d.b)}`+
    `<h2>stepwise structural diff (D17③)</h2>${alignView(d.align)}`+
    `<h2>context growth (shared scale)</h2>${saws(d.a,d.b)}`+
    `<h2>resources — what context each run loaded</h2>`+
    `<p class="note">Files matched by name across runs. "A only" = context run A saw and B didn't (and vice-versa) — often why two runs diverged.</p>${resDiff(d.resources)}`
}
async function boot(){
  let opts='<option value="">—</option>'
  try{
    const pj=await fetch('/api/projects').then(r=>r.json())
    for(const p of (pj.projects||[])){
      opts+=`<optgroup label="${esc(p.name||p.slug)}">`
      for(const s of (p.sessions||[])) opts+=`<option value="${esc(s.session_id)}">${esc(sessionLabel(s))}</option>`
      opts+='</optgroup>'
    }
  }catch(e){}
  const a=document.getElementById('selA'), b=document.getElementById('selB')
  a.innerHTML=opts; b.innerHTML=opts
  // pre-pick the two most recent distinct sessions if available
  const vals=[...a.querySelectorAll('option')].map(o=>o.value).filter(Boolean)
  if(vals[0]) a.value=vals[0]
  if(vals[1]) b.value=vals[1]; else if(vals[0]) b.value=vals[0]
  a.onchange=render; b.onchange=render
  render()
}
boot()
</script>
</body>
</html>
