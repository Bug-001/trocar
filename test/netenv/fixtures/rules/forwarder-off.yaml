{
"mode": "rule",
"bind-address": "127.0.0.1",
"allow-lan": false,
"find-process-mode": "always",
"log-level": "warning",
"profile": {
  "store-selected": false,
  "store-fake-ip": false
},
"geo-auto-update": false,
"geox-url": {
  "geoip": "http://127.0.0.1:9/g",
  "geosite": "http://127.0.0.1:9/g",
  "mmdb": "http://127.0.0.1:9/g",
  "asn": "http://127.0.0.1:9/g"
},
"external-controller": "127.0.0.1:18899",
"secret": "abcdef0123456789abcdef0123456789",
"listeners": [
  {"name":"asight-l-claude-code.cli","type":"mixed","listen":"127.0.0.1","port":18801,"rule":"in-claude-code.cli"},
  {"name":"asight-l-codex.app","type":"mixed","listen":"127.0.0.1","port":18802,"rule":"in-codex.app"}
],
"proxies": [
  {"name":"asight-up-claude-code.cli","type":"direct"},
  {"name":"asight-up-codex.app","type":"http","server":"127.0.0.1","port":7897}
],
"sub-rules": {
  "in-claude-code.cli": ["MATCH,asight-up-claude-code.cli"],
  "in-codex.app": ["MATCH,asight-up-codex.app"]
},
"rules": ["MATCH,DIRECT"]
}
