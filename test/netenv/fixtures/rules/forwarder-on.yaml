{
"mode": "rule",
"bind-address": "127.0.0.1",
"allow-lan": false,
"find-process-mode": "always",
"log-level": "warning",
"profile": {
  "store-selected": false,
  "store-fake-ip": false
},
"geo-auto-update": false,
"geox-url": {
  "geoip": "http://127.0.0.1:9/g",
  "geosite": "http://127.0.0.1:9/g",
  "mmdb": "http://127.0.0.1:9/g",
  "asn": "http://127.0.0.1:9/g"
},
"external-controller": "127.0.0.1:18899",
"secret": "abcdef0123456789abcdef0123456789",
"listeners": [
  {"name":"asight-l-claude-code.cli","type":"mixed","listen":"127.0.0.1","port":18801,"rule":"in-claude-code.cli"},
  {"name":"asight-l-codex.app","type":"mixed","listen":"127.0.0.1","port":18802,"rule":"in-codex.app"}
],
"proxies": [
  {"name":"asight-in-claude-code.cli","type":"http","server":"127.0.0.1","port":18790,"username":"of.claude-code.cli","password":"0123456789abcdef0123456789abcdef"},
  {"name":"asight-re-claude-code.cli","type":"http","server":"127.0.0.1","port":18801},
  {"name":"asight-up-claude-code.cli","type":"direct"},
  {"name":"asight-up-codex.app","type":"http","server":"127.0.0.1","port":7897}
],
"proxy-groups": [
  {"name":"asight-fb-claude-code.cli","type":"fallback","proxies":["asight-in-claude-code.cli","asight-re-claude-code.cli"],"url":"http://127.0.0.1:18801/asight-health/claude-code.cli","interval":30,"timeout":2000,"lazy":true},
  {"name":"asight-sw-claude-code.cli","type":"select","proxies":["PASS","asight-fb-claude-code.cli"]}
],
"rule-providers": {"asight-r-claude-code.cli":{"type":"file","behavior":"classical","format":"text","path":"./asight/route-claude-code.cli.txt","payload":["DOMAIN,asight-off.invalid"]}},
"sub-rules": {
  "in-claude-code.cli": ["AND,((DST-PORT,18801),(IP-CIDR,127.0.0.1/32,no-resolve)),DIRECT","RULE-SET,asight-r-claude-code.cli,asight-sw-claude-code.cli","MATCH,asight-up-claude-code.cli"],
  "in-codex.app": ["MATCH,asight-up-codex.app"]
},
"rules": ["MATCH,DIRECT"]
}
